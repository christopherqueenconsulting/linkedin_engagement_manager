# Production overlay for the Hostinger VPS.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from the dev base (docker-compose.yml):
#   - Runs prebuilt GHCR images by tag (no local build, no ./src bind-mount).
#   - FastAPI runs multi-worker with no --reload (/start-fastapi-cloud).
#   - No internal ports published to the host — Cloudflare Tunnel reaches
#     services over the compose network instead.
#   - Flower requires basic auth; cloudflared is added to expose the stack.
#   - restart: unless-stopped + resource caps on everything long-running.
#
# DOCKER_IMAGE_NAME=ghcr.io/gitchrisqueen/cqc-lem and IMAGE_TAG are set in the
# VPS .env (IMAGE_TAG is overridden per-deploy by scripts/deploy.sh).

services:
  # Zero-downtime edge: in prod, `web_app` is a tiny nginx that KEEPS THE NAME the Cloudflare
  # tunnel targets (http://web_app:8000, dashboard-managed) while the actual FastAPI app runs in
  # web_api_blue / web_api_green behind it. scripts/deploy.sh starts the new color, health-checks
  # it, renders deploy/nginx/default.conf to point at it, and does a graceful `nginx -s reload` —
  # so a deploy never takes the site down. The rendered conf lives in the git-ignored ./deploy/
  # dir so a release checkout can't clobber the live routing state.
  web_app:
    build: !reset null
    image: nginx:1.27-alpine
    command: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    # No hard dependency on the colors: per-request DNS in the conf tolerates a briefly-absent
    # backend, and a green-only failure must never block the edge from starting.
    depends_on: !reset []
    env_file: !reset []
    volumes: !override
      - ./deploy/nginx:/etc/nginx/conf.d:ro
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 128m

  web_api_blue: &web_api
    image: "${DOCKER_IMAGE_NAME}:${IMAGE_TAG:-latest}"
    container_name: web_api_blue
    command: /start-fastapi-cloud
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Stale-chunk retention (issue #743). Releases batch 4x daily and a tab open across one still
      # asks for the PREVIOUS build's hashed lazy chunks; the app syncs each build's dist/assets
      # into this volume and serves a miss out of it, so those tabs keep working instead of 404ing.
      # Both colors share it, and it outlives the image — which is the whole point.
      - SPA_ASSET_ARCHIVE_DIR=/app/spa_asset_archive
    # Ship code in the image — no dev source/test bind-mounts (see the note that used to live on
    # web_app: a ./src mount would mask the image's built SPA and 404 "/").
    volumes:
      - ./logs:/app/logs
      # Shared, persistent generated-media store (served at /api/assets).
      - assets:/app/src/cqc_lem/assets
      - spa_asset_archive:/app/spa_asset_archive
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g

  # Both colors run at all times (the inactive one is a warm standby on ~0 traffic), which keeps
  # the compose model simple: `up -d` converges everything, and only deploy.sh decides routing.
  web_api_green:
    <<: *web_api
    container_name: web_api_green

  redis:
    restart: unless-stopped
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 1g

  mysql:
    restart: unless-stopped
    # Loopback-only publish so DB GUIs (e.g. Sequel Ace) can reach it via an SSH
    # tunnel to the VPS; never exposed to the WAN (127.0.0.1 bind + ufw).
    ports: !override ["127.0.0.1:3306:3306"]
    deploy:
      resources:
        limits:
          memory: 2g

  celery_worker:
    image: "${DOCKER_IMAGE_NAME}:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    volumes: !override
      - ./logs:/app/logs
      - ~/.aws:/home/celeryworker/.aws:ro
      # Shared, persistent store so generated assets are visible to web_app.
      - assets:/app/src/cqc_lem/assets
    deploy:
      resources:
        limits:
          cpus: '3'
          memory: 4g
        reservations:
          cpus: '1'

  celery_worker_selenium:
    image: "${DOCKER_IMAGE_NAME}:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    volumes: !override
      - ./logs:/app/logs
      - ~/.aws:/home/celeryworker/.aws:ro
      # Shared, persistent store so generated assets are visible to web_app.
      - assets:/app/src/cqc_lem/assets
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2g
        reservations:
          cpus: '0.5'

  # Lane workers are light celery clients (Chrome runs in selenium-chrome), so
  # 1cpu/2g each is plenty.
  celery_worker_selenium_prepost:
    image: "${DOCKER_IMAGE_NAME}:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    volumes: !override
      - ./logs:/app/logs
      - ~/.aws:/home/celeryworker/.aws:ro
      # Shared, persistent store so generated assets are visible to web_app.
      - assets:/app/src/cqc_lem/assets
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2g
        reservations:
          cpus: '0.5'

  celery_worker_selenium_outreach:
    image: "${DOCKER_IMAGE_NAME}:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    volumes: !override
      - ./logs:/app/logs
      - ~/.aws:/home/celeryworker/.aws:ro
      # Shared, persistent store so generated assets are visible to web_app.
      - assets:/app/src/cqc_lem/assets
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2g
        reservations:
          cpus: '0.5'

  celery_worker_selenium_content:
    image: "${DOCKER_IMAGE_NAME}:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    volumes: !override
      - ./logs:/app/logs
      - ~/.aws:/home/celeryworker/.aws:ro
      # Shared, persistent store so generated assets are visible to web_app.
      - assets:/app/src/cqc_lem/assets
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2g
        reservations:
          cpus: '0.5'

  celery_beat:
    image: "${DOCKER_IMAGE_NAME}:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    volumes: !override
      - ./logs:/app/logs
      # Shared, persistent store so generated assets are visible to web_app.
      - assets:/app/src/cqc_lem/assets
    deploy:
      resources:
        limits:
          memory: 1g

  flower:
    image: "${DOCKER_IMAGE_NAME}:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    ports: !reset []
    volumes: !override
      - ./logs:/app/logs
      - flower_db:/data
    environment:
      # Optional basic auth + persistence. Flower is gated by Cloudflare Zero Trust Access
      # regardless; basic auth is extra protection. Requires BOTH user and password: with only
      # one set this would expand to "user:" or ":pass", which Flower would happily enforce as
      # a half-blank credential. Unset either one and the value collapses to EMPTY — which
      # Flower still treats as "auth on" (an empty credential nobody can satisfy), so the
      # flower start script unsets it when empty. Together those make the intended
      # "no credentials configured = no auth" actually true.
      - FLOWER_BASIC_AUTH=${CELERY_FLOWER_PASSWORD:+${CELERY_FLOWER_USER:+${CELERY_FLOWER_USER}:${CELERY_FLOWER_PASSWORD}}}
      - FLOWER_PERSISTENT=True
      - CELERY_TIMEZONE=${CELERY_TIMEZONE:-UTC}
    deploy:
      resources:
        limits:
          memory: 512m

  selenium-chrome:
    # Session cap (8), shm (8g) and limits (8cpu/8g) come from the base file — prod runs the
    # same browser pool as dev so the "cap == summed lane concurrency" invariant holds in both.
    # Bind noVNC (7900) and the Selenium hub (4444) to loopback only. 7900 lets the
    # live browser be watched via an SSH tunnel (ssh -L 7900:localhost:7900 …) or the
    # lemvnc.<domain> Cloudflare hostname; 4444 lets host-side tooling — notably the
    # Selenium MCP server (tools/selenium_mcp_server.py) — drive that same browser for
    # interactive debugging. Neither is exposed publicly (loopback + host firewall);
    # for browser access add a public hostname in Cloudflare Zero Trust (gate with Access).
    ports: !override ["127.0.0.1:7900:7900", "127.0.0.1:4444:4444"]

  litellm:
    # already restart: unless-stopped in the base file
    # Loopback-only publish so the Ollama agent lane (claude -p with ANTHROPIC_BASE_URL pointed
    # here) can reach the proxy from the host without exposing it on the WAN — same pattern as
    # the selenium-chrome 4444 bind above. !override replaces the base 4000:4000 (all-interfaces)
    # rather than merging into a double bind.
    ports: !override ["127.0.0.1:4000:4000"]
    deploy:
      resources:
        limits:
          memory: ${LITELLM_MEM_LIMIT:-1500m}
          cpus: "${LITELLM_CPU_LIMIT:-2.5}"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - web_app
    deploy:
      resources:
        limits:
          memory: 256m

# Persistent, shared store for generated post media (videos/images) served at
# /api/assets. Mounted on web_app + celery workers so the generator and the
# server share one location that survives container recreates.
volumes:
  assets:
  # Last N deployed SPA bundles' hashed assets (issue #743) — shared by both colors so a tab that
  # predates the current release can still fetch the lazy chunks it holds hashes for. Pruned by the
  # app on each deploy; content-hashed names mean an old hash is always safe to serve.
  spa_asset_archive:
