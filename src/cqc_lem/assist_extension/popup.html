<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LEM Assist</title>
    <style>
      body { font: 13px system-ui, sans-serif; width: 360px; margin: 12px; }
      input { width: 100%; box-sizing: border-box; margin: 2px 0 8px; }
      li { margin: 0 0 8px; list-style: none; }
      ul { padding: 0; }
      .text { color: #444; }
    </style>
  </head>
  <body>
    <h3>LEM Assist</h3>
    <label>LEM address <input id="base" placeholder="https://lem.example.com" /></label>
    <label>Assist token <input id="token" type="password" /></label>
    <button id="save">Save</button>
    <button id="refresh">Load approved comments</button>
    <p id="status"></p>
    <ul id="queue"></ul>
    <p>Open a post, review the text, press Post yourself. Assist never posts.</p>
    <script src="popup.js"></script>
  </body>
</html>
