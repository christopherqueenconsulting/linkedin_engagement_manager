[tool.poetry]
name = "linkedin-engagement-manager"
version = "0.153.3"
description = ""
authors = ["gitchrisqueen <christopher.queen@gmail.com>"]
readme = "README.md"
packages = [
    { include = "cqc_lem", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"

# --- Web / API ---
fastapi = ">=0.115.4,<0.142.0"
uvicorn = ">=0.32,<0.53"
pydantic-extra-types = "^2.10.0"
python-dotenv = "^1.0"
python-multipart = ">=0.0.9,<1.0"
requests = "^2.32.3"
typing-extensions = "^4.12.2"

# --- Task queue ---
celery = {version = "^5.4.0", extras = ["redis"]}
redis = ">=5.2,<7.0"
celery-once = {git = "https://github.com/gitchrisqueen/celery-once.git"}
flower = "^2.0.1"

# --- Database ---
mysql-connector-python = ">=9.1,<27.0"

# --- LinkedIn automation ---
selenium = "^4.25"
linkedin-api-client = "^0.3.0"
# `bs4` is a stub package that only depends on the real one; depend on it directly so the
# constraint applies to the library we actually import.
beautifulsoup4 = "^4.12"

# --- AI / external APIs ---
openai = ">=1.52.2,<3.0.0"
googlenews = "^1.6.15"
runwayml = ">=2.1,<6.0"
replicate = "^1.0.4"
pexels-api = "^1.0.1"
capsolver = "^1.0"

# --- Content provenance (C2PA Content Credentials) ---
c2pa-python = ">=0.36,<1.0"
cryptography = ">=42.0"

# --- Strong authentication (issue #745, phase 2c) ---
# All permissive and self-hosted, per docs/AUTH_SECURITY_DESIGN.md §6: webauthn (duo-labs
# py_webauthn) is BSD-3-Clause, pyotp and argon2-cffi are MIT. No service, no third party.
webauthn = "^3.0"
pyotp = "^2.9"
argon2-cffi = "^25.1"

# --- Content processing ---
markdownify = ">=0.13.1,<1.3.0"
tldextract = "^5.1.2"
pillow = ">=10.0,<13.0"
python-pptx = "^1.0.2"
dateparser = "^1.2.0"

# --- Observability ---
posthog = ">=3.7,<8.0"
opentelemetry-api = "^1.28.2"
opentelemetry-sdk = "^1.28.2"
opentelemetry-exporter-otlp = "^1.28.2"

# --- AWS / payments ---
boto3 = "^1.36.7"
sendgrid = "^6.12.5"
stripe = "^15.2.1"

timezonefinder = ">=6.5,<9.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
# Development Tools
jupyter = "^1.0.0"
setuptools = ">=67.6.1,<84.0.0"
grandalf = "^0.8"
watchdog = ">=5.0.3,<7.0.0"

# The AWS CDK toolchain lived here until #973 retired the CDK deploy path (2026-08-11). Docker
# Compose on the VPS is the only supported deploy, so nothing in the tree imports `aws_cdk` any more.


[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
ruff = ">=0.1.5,<0.17.0"
mypy = ">=1.11,<3.0"

[tool.poetry.group.mcp]
optional = true

[tool.poetry.group.mcp.dependencies]
# Powers tools/selenium_mcp_server.py — an MCP server that drives the live
# selenium-chrome browser (watchable via lemvnc) for interactive debugging.
# Install with: poetry install --with mcp
mcp = ">=1.2.0"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
# The only dependencies that should be added are
# dependencies used for running tests (e.g., pytest, freezegun, response).
# Any dependencies that do not meet that criteria will be removed.
pytest = ">=9.1,<10.0"
pytest-cov = ">=4.1,<8.0"
freezegun = "^1.2.2"
pytest-mock = "^3.10.0"
syrupy = ">=4.0.2,<6.0.0"
pytest-watcher = ">=0.3.4,<0.7.0"
pytest-asyncio = ">=0.21.1,<1.5.0"
grandalf = "^0.8"
pytest-profiling = "^1.7.0"
pytest-playwright = ">=0.4.0,<1.0.0"
# Parallelism for the INTEGRATION lane only (issue #1185). The unit lane stays single-process:
# issue #480 measured xdist there at ~19s on 4 workers against ~20s serial, so it buys nothing.
pytest-xdist = "^3.6"
# Reads the repo's own YAML under test — the GitHub issue-form template that the agent pipeline's
# structured Phase field is declared in. Only the `dev` group carried it transitively, and the unit
# lane installs `--with test` only.
pyyaml = "^6.0"


[tool.coverage.run]
# sys.monitoring-based tracer (CPython 3.12+, which this project requires). Same line-coverage
# results as the C tracer at roughly half the measurement overhead — issue #480 measured the
# unit suite at 33s with the default core vs 19s with sysmon, byte-identical coverage totals.
core = "sysmon"
omit = [
    "tests/*",
    "src/cqc_lem/ui/*",
    # Selenium browser driver utilities — E2E only, require Chrome container
    "src/cqc_lem/utilities/selenium_util.py",
    "src/cqc_lem/utilities/linkedin/scrapper.py",
    "src/cqc_lem/utilities/linkedin/company_page_inviter.py",
    # PIL image rendering — visual output, no unit-test strategy
    "src/cqc_lem/utilities/carousel_creator.py",
]
source = ["src/cqc_lem"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]

[tool.ruff]
# The house width. Without this ruff measures against its 88-column default, which reported 24,584
# line-too-long errors against code that has always been written to 120 — the flood that made the
# lint step advisory (`continue-on-error`) and so hid every real defect behind it.
line-length = 120

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "T201", # print
    "D", # pydocstyle - Google-style docstrings
    "TID251", # banned-api — only what is listed below, NOT TID252 (relative imports)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The `myprint` shim resolved to logger.info/logger.debug from a `debug=` flag, which hid the LEVEL
# at the call site. Level is a routing decision here — `log_warning` escalates on repeat and files a
# grouped `$exception` — so it has to be legible in the function name. All 713 call sites were
# rewritten to the level each already resolved to; this keeps a 714th from appearing.
"cqc_lem.utilities.logger.myprint".msg = "Retired. Use log_debug / log_info / log_warning / log_error / log_critical."

[tool.ruff.lint.isort]
# Without this, isort gives every `X as _X` re-export its own `from ... import (...)` statement.
# `ai_helper` deliberately aliases 13 `content_alignment` constants under ONE commented block to
# keep its long-standing internal API stable; splitting them turned that into 13 near-duplicate
# statements with the explanation heading only the first, and added +69 import statements repo-wide.
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Tests: a test's NAME is its documentation, and this suite already writes a docstring wherever the
# reason for a test is not obvious. Requiring one on all ~10,700 of them would generate exactly the
# boilerplate the house rule warns against, so only the FORMAT rules apply here.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]


[tool.mypy]
# ADVISORY, and deliberately narrow (issue #1221). The #1154 audit found ZERO live instances of the
# `Optional[bool]` truthiness bug, so this is prevention, not a fix — it is only worth having while
# it stays cheap. It is not a required check and `scripts/mypy_check.sh` always exits 0, so nothing
# here can ever block a PR. Rationale + how the list grows: docs/typing-guard.md.
python_version = "3.12"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
# This tree ships no third-party stubs and the guard is not about them.
ignore_missing_imports = true
# Only the files listed below are GRADED; everything they import is read for signatures only, which
# is what keeps a 13-module check off the whole 400k-line tree.
follow_imports = "silent"
# The three settings the guard exists for: None must never reach a non-Optional position, an
# implicit `x: str = None` is not an Optional declaration, and a path that forgets to return is a
# missing value, not an implicit None.
strict_optional = true
no_implicit_optional = true
warn_no_return = true

# Scope: modules whose PUBLIC returns are genuinely `Optional`, where None means UNKNOWN and reading
# it for truth silently answers a different question. Each entry states which contract it protects.
# Add a module only when it already checks clean — a scope with known errors in it stops being read.
files = [
    "src/cqc_lem/utilities/flags.py",                      # resolve_flag: None = unresolvable, falls open to env
    "src/cqc_lem/utilities/experiments.py",                # unresolvable experiment = CONTROL, never a fallback
    "src/cqc_lem/utilities/routing_policy.py",             # None = no down-route decision (stdlib-only, also mounted into LiteLLM)
    "src/cqc_lem/utilities/suppression.py",                # `unknown` on a thin baseline is never actioned
    "src/cqc_lem/utilities/comment_outcomes.py",           # visible_most_relevant is 1 / 0 / NULL-unreadable
    "src/cqc_lem/utilities/engagement_window.py",          # None = no marker read, not a spent slot
    "src/cqc_lem/utilities/auth_rate_limit.py",            # None = budget unreadable, not budget available
    "src/cqc_lem/utilities/blog_source.py",                # None = nothing readable to repurpose, never blocking
    "src/cqc_lem/utilities/golden_hour.py",                # unmeasured latency is never on-time
    "src/cqc_lem/utilities/linkedin/stale_invites.py",     # an unreadable "Sent … ago" is NEVER stale
    "src/cqc_lem/utilities/linkedin/login_status.py",      # `unknown` = nothing recorded, NOT signed out
    "src/cqc_lem/utilities/linkedin/message_thread.py",    # ThreadState is three-valued and UNKNOWN SKIPS
    "src/cqc_lem/utilities/linkedin/token_refresh.py",     # days_remaining is None, never 0, when unreadable
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
# --strict-markers will raise errors on unknown marks.
# https://docs.pytest.org/en/7.1.x/how-to/mark.html#raising-errors-on-unknown-marks
#
# https://docs.pytest.org/en/7.1.x/reference/reference.html
# --strict-config       any warnings encountered while parsing the `pytest`
#                       section of the configuration file raise errors.
#
# https://github.com/tophat/syrupy
# --snapshot-warn-unused    Prints a warning on unused snapshots rather than fail the test suite.
addopts = "--snapshot-warn-unused --strict-markers --strict-config --durations=5 -v"
norecursedirs = ["_deprecated", ".git", "__pycache__", ".venv", "node_modules"]
# Registering custom markers.
# https://docs.pytest.org/en/7.1.x/example/markers.html#registering-markers
markers = [
    "requires: mark tests as requiring a specific library",
    "asyncio: mark tests as requiring asyncio",
    "compile: mark placeholder test used to compile integration tests without running them",
    "unit: mark a test as a unit test",
    "integration: mark a test as an integration test",
    "slow: mark test as slow running",
    "requires_openai: mark test as requiring real OpenAI API access",
    "requires_database: mark test as requiring real database connection",
    "requires_selenium: mark test as requiring real browser automation",
]
asyncio_mode = "auto"
