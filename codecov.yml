codecov:
  # Don't block CI if Codecov itself is unreachable
  require_ci_to_pass: false
  # Number of coverage uploads to wait for before posting a combined status. THREE: the unit lane is
  # sharded across two jobs that each upload under the `unit` flag, plus integration. (It was four
  # while the e2e lane uploaded a fourth; that lane was deleted in #1215.)
  # This MUST track the shard count. Too high and Codecov waits forever for an upload that is never
  # coming and posts no status at all; too low and it publishes a number computed from a partial
  # set, which reads as a coverage drop that isn't one. Both failure modes read as a coverage
  # problem rather than as a config problem, which is how #1340 came to be filed — so the number is
  # no longer maintained by hand: `tests/unit/test_codecov_upload_contract.py` derives it from the
  # workflows that actually upload, and fails the build when the two drift.
  notify:
    after_n_builds: 3

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        # ENFORCED coverage floor, and it is earned by the two real lanes alone.
        #
        # #1340 measured this target against a project number it believed was ~8 points of
        # import-time coverage donated by the e2e lane — that lane ran pytest against a separate,
        # uninstrumented uvicorn over HTTP, so it credited every module its imports touched and
        # none of the handlers it drove. Dropping its upload from a PR read as 94.98% -> 86.86%,
        # which is why #1338 could not move the lane and why lowering this target to ~87% looked
        # like honesty rather than a cut.
        #
        # The lane was then deleted outright (#1215), and the drop did not happen. Measured on
        # main at 6a145efa, from unit + integration only: project 95.06%, with the `e2e` flag at
        # zero sessions and zero lines — i.e. nothing carried forward. Per flag, `unit` 93.50% and
        # `integration` 32.62%, whose union is that 95.06%. Per component: FastAPI Endpoints
        # 94.98% (#1340 predicted 72.51% without e2e), Celery Tasks 92.61%, Utilities 96.47%,
        # LinkedIn Automation 94.62%. So the 86.86% was an artifact of that PR's upload set, not a
        # property of the code, and this floor sits ~5 points BELOW a baseline real tests earn.
        #
        # Therefore: do NOT "re-baseline" this to ~87%. That would be a real cut justified by a
        # number that has never reproduced without the e2e flag. Raise the target as the baseline
        # rises — never lower it. The 1% threshold absorbs run-to-run flake.
        target: 90%
        threshold: 1%
        informational: false
        carryforward_behavior: include
    patch:
      default:
        # New code in a PR must be 80% covered — ENFORCED (per CLAUDE.md testing standards).
        target: 80%
        threshold: 5%
        informational: false

# Exactly the flags some workflow uploads under, no more. A flag declared here with nothing
# uploading it keeps carrying a stale report forward into the project number, and a flag uploaded
# without being declared merges in a report nobody scoped — either way the number stops describing
# what the lanes ran. `tests/unit/test_codecov_upload_contract.py` holds both directions.
flags:
  unit:
    # Python unit tests — run on every PR
    paths:
      - src/cqc_lem/
    carryforward: true
  integration:
    # Integration tests with real MySQL + Redis
    paths:
      - src/cqc_lem/
    carryforward: true

# Files/directories that are NOT our code and should be excluded from coverage
ignore:
  # React frontend — JS/TS, not tracked by Python coverage anyway
  - "src/cqc_lem/ui/"
  # Selenium browser-driving utilities. No automated lane drives a real browser (#1215) — what
  # grades these against LinkedIn is the read-only live probe, scripts/linkedin_live_validation.py.
  - "src/cqc_lem/utilities/selenium_util.py"
  - "src/cqc_lem/utilities/linkedin/scrapper.py"
  - "src/cqc_lem/utilities/linkedin/company_page_inviter.py"
  # PIL image rendering — visual output, no unit-test strategy
  - "src/cqc_lem/utilities/carousel_creator.py"
  # Docker / database setup scripts
  - "compose/"
  # Test code itself
  - "tests/"
  # GitHub Actions workflows
  - ".github/"
  # Documentation and config files
  - "*.md"
  - "*.toml"
  - "*.yml"
  - "*.yaml"

component_management:
  default_rules:
    statuses:
      - type: project
        target: 80%
        informational: true
  individual_components:
    - component_id: api
      name: FastAPI Endpoints
      paths:
        - src/cqc_lem/api/
    - component_id: celery_tasks
      name: Celery Tasks
      paths:
        - src/cqc_lem/app/
    - component_id: utilities
      name: Utilities
      paths:
        - src/cqc_lem/utilities/
    - component_id: linkedin_automation
      name: LinkedIn Automation
      paths:
        - src/cqc_lem/utilities/linkedin/
