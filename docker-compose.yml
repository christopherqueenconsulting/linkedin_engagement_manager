services:
  web_app:
    build:
      context: .
      dockerfile: ./compose/local/Dockerfile
      args:
        - INSTALL_DEV_DEPS=${INSTALL_DEV_DEPS}
    image: "${DOCKER_IMAGE_NAME}:latest"
    container_name: web_app
    command: /start-fastapi
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./logs:/app/logs
    env_file:
      - .env
    ports:
      - "${API_PORT}:${API_PORT}"

  redis:
    image: redis:alpine
    container_name: redis
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: ${MYSQL_HOST}
    hostname: ${MYSQL_HOST}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${MYSQL_PORT}:${MYSQL_PORT}"
    volumes:
      - db_data:/var/lib/mysql
      - ./compose/local/database/setup.sql:/docker-entrypoint-initdb.d/setup.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  flyway:
    image: redgate/flyway:latest-alpine
    container_name: flyway
    entrypoint: /flyway-entrypoint.sh
    env_file:
      - .env
    volumes:
      - ./compose/local/database/migrations:/flyway/sql
      - ./compose/local/database/flyway-entrypoint.sh:/flyway-entrypoint.sh
    depends_on:
      mysql:
        condition: service_healthy

  celery_worker:
    image: ${DOCKER_IMAGE_NAME}
    container_name: celery_worker
    hostname: ${CELERY_WORKER_HOST}
    command: /start-celeryworker
    # Docker's default is 10s — far shorter than a video generation (~6 min) or a commenting
    # loop, so a deploy SIGKILLed running tasks. Give Celery's warm shutdown room to finish
    # what is running (it exits as soon as it drains, so this is a ceiling, not a delay). #549
    stop_grace_period: ${CELERY_STOP_GRACE_PERIOD:-8m}
    deploy:
      resources:
        limits:
          cpus: '4'
        reservations:
          cpus: '2'
    volumes:
      - ~/.aws:/home/celeryworker/.aws:ro
    volumes_from:
      - web_app
    env_file:
      - .env
    environment:
      - CELERY_TIMEZONE=${CELERY_TIMEZONE:-UTC}
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      selenium-chrome:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery --app cqc_lem.app.my_celery inspect ping -t 5 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  celery_worker_selenium:
    image: ${DOCKER_IMAGE_NAME}
    container_name: celery_worker_selenium
    command: /start-celeryworker-selenium
    # Selenium lanes run the longest tasks in the stack — let warm shutdown finish them
    # instead of Docker's 10s default SIGKILL (issue #549).
    stop_grace_period: ${CELERY_STOP_GRACE_PERIOD:-8m}
    deploy:
      resources:
        limits:
          cpus: '1'
        reservations:
          cpus: '0.5'
    volumes:
      - ~/.aws:/home/celeryworker/.aws:ro
    volumes_from:
      - web_app
    env_file:
      - .env
    environment:
      - CELERY_TIMEZONE=${CELERY_TIMEZONE:-UTC}
      - SELENIUM_QUEUES=se_engage
      # Keep the lane totals equal to selenium-chrome's SE_NODE_MAX_SESSIONS (see there).
      - SELENIUM_CONCURRENCY=3
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      selenium-chrome:
        condition: service_healthy
    healthcheck:
      # $$ escapes compose interpolation so the CONTAINER shell expands SELENIUM_QUEUES at runtime
      # (a bare $ is blanked by compose at parse time → selenium--worker → matches no node → false unhealthy).
      test: ["CMD-SHELL", "celery --app cqc_lem.app.my_celery inspect ping -d selenium-$${SELENIUM_QUEUES}-worker@$(hostname) -t 10 || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s

  # Pre-post warm-up lane (issue #553). Same image/command as the other lanes; it exists only so
  # the eta-bound `automate_commenting` dispatched by auto_check_scheduled_posts never waits on a
  # 15-minute golden-hour loop holding an se_engage slot. Concurrency 2 = two users' posts can be
  # warmed up in the same window.
  celery_worker_selenium_prepost:
    image: ${DOCKER_IMAGE_NAME}
    container_name: celery_worker_selenium_prepost
    command: /start-celeryworker-selenium
    # Selenium lanes run the longest tasks in the stack — let warm shutdown finish them
    # instead of Docker's 10s default SIGKILL (issue #549).
    stop_grace_period: ${CELERY_STOP_GRACE_PERIOD:-8m}
    deploy:
      resources:
        limits:
          cpus: '1'
        reservations:
          cpus: '0.5'
    volumes:
      - ~/.aws:/home/celeryworker/.aws:ro
    volumes_from:
      - web_app
    env_file:
      - .env
    environment:
      - CELERY_TIMEZONE=${CELERY_TIMEZONE:-UTC}
      - SELENIUM_QUEUES=se_prepost
      # Keep the lane totals equal to selenium-chrome's SE_NODE_MAX_SESSIONS (see there).
      - SELENIUM_CONCURRENCY=2
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      selenium-chrome:
        condition: service_healthy
    healthcheck:
      # $$ escapes compose interpolation so the CONTAINER shell expands SELENIUM_QUEUES at runtime
      # (a bare $ is blanked by compose at parse time → selenium--worker → matches no node → false unhealthy).
      test: ["CMD-SHELL", "celery --app cqc_lem.app.my_celery inspect ping -d selenium-$${SELENIUM_QUEUES}-worker@$(hostname) -t 10 || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s

  celery_worker_selenium_outreach:
    image: ${DOCKER_IMAGE_NAME}
    container_name: celery_worker_selenium_outreach
    command: /start-celeryworker-selenium
    # Selenium lanes run the longest tasks in the stack — let warm shutdown finish them
    # instead of Docker's 10s default SIGKILL (issue #549).
    stop_grace_period: ${CELERY_STOP_GRACE_PERIOD:-8m}
    deploy:
      resources:
        limits:
          cpus: '1'
        reservations:
          cpus: '0.5'
    volumes:
      - ~/.aws:/home/celeryworker/.aws:ro
    volumes_from:
      - web_app
    env_file:
      - .env
    environment:
      - CELERY_TIMEZONE=${CELERY_TIMEZONE:-UTC}
      - SELENIUM_QUEUES=se_outreach
      # Keep the lane totals equal to selenium-chrome's SE_NODE_MAX_SESSIONS (see there).
      - SELENIUM_CONCURRENCY=2
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      selenium-chrome:
        condition: service_healthy
    healthcheck:
      # $$ escapes compose interpolation so the CONTAINER shell expands SELENIUM_QUEUES at runtime
      # (a bare $ is blanked by compose at parse time → selenium--worker → matches no node → false unhealthy).
      test: ["CMD-SHELL", "celery --app cqc_lem.app.my_celery inspect ping -d selenium-$${SELENIUM_QUEUES}-worker@$(hostname) -t 10 || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s

  celery_worker_selenium_content:
    image: ${DOCKER_IMAGE_NAME}
    container_name: celery_worker_selenium_content
    command: /start-celeryworker-selenium
    # Selenium lanes run the longest tasks in the stack — let warm shutdown finish them
    # instead of Docker's 10s default SIGKILL (issue #549).
    stop_grace_period: ${CELERY_STOP_GRACE_PERIOD:-8m}
    deploy:
      resources:
        limits:
          cpus: '1'
        reservations:
          cpus: '0.5'
    volumes:
      - ~/.aws:/home/celeryworker/.aws:ro
    volumes_from:
      - web_app
    env_file:
      - .env
    environment:
      - CELERY_TIMEZONE=${CELERY_TIMEZONE:-UTC}
      - SELENIUM_QUEUES=se_content
      # Keep the lane totals equal to selenium-chrome's SE_NODE_MAX_SESSIONS (see there).
      - SELENIUM_CONCURRENCY=1
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      selenium-chrome:
        condition: service_healthy
    healthcheck:
      # $$ escapes compose interpolation so the CONTAINER shell expands SELENIUM_QUEUES at runtime
      # (a bare $ is blanked by compose at parse time → selenium--worker → matches no node → false unhealthy).
      test: ["CMD-SHELL", "celery --app cqc_lem.app.my_celery inspect ping -d selenium-$${SELENIUM_QUEUES}-worker@$(hostname) -t 10 || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s

  celery_beat:
    image: ${DOCKER_IMAGE_NAME}
    container_name: celery_beat
    command: /start-celerybeat
    # Beat holds no task work — a short grace is enough to flush its schedule state.
    stop_grace_period: 30s
    volumes_from:
      - web_app
    env_file:
      - .env
    environment:
      - CELERY_TIMEZONE=${CELERY_TIMEZONE:-UTC}
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      selenium-chrome:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os, sys; cmds=[open('/proc/'+p+'/cmdline').read().replace(chr(0),' ') for p in os.listdir('/proc') if p.isdigit() and os.path.exists('/proc/'+p+'/cmdline')]; sys.exit(0 if any('celery' in c and 'beat' in c for c in cmds) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  flower:
    image: ${DOCKER_IMAGE_NAME}
    container_name: celery_flower
    command: /start-flower-no-wait
    volumes:
      - ./logs:/app/logs
      - flower_db:/data
    volumes_from:
      - web_app
    env_file:
      - .env
    environment:
      - FLOWER_UNAUTHENTICATED_API=True
      - FLOWER_PERSISTENT=False
      - CELERY_TIMEZONE=${CELERY_TIMEZONE:-UTC}
    ports:
      - "${CELERY_FLOWER_PORT}:${CELERY_FLOWER_PORT}"
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${CELERY_FLOWER_PORT}/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  selenium-chrome:
    image: selenium/standalone-chrome:latest
    container_name: selenium-chrome
    hostname: selenium-chrome
    # shm scales with sessions — a starved /dev/shm crashes tabs.
    shm_size: 8g
    ports:
      - "${SELENIUM_HUB_PORT}:4444"
      - "7900:7900"
    environment:
      # INVARIANT: SE_NODE_MAX_SESSIONS == the sum of every lane worker's SELENIUM_CONCURRENCY
      # (se_engage 3 + se_prepost 2 + se_outreach 2 + se_content 1 = 8). Below the sum, lanes
      # block on session acquisition instead of on their own slot and time-sensitive tasks miss
      # their window; above it, slots sit idle. This is the Phase-1 end state: #553 added the
      # se_prepost lane (cap 6), #552 raised se_engage/se_outreach (the remaining 2).
      # Enforced by tests/unit/app/test_selenium_capacity.py. See docs/scaling-plan.md §5a.
      - SE_NODE_MAX_SESSIONS=8
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
      - SE_NODE_SESSION_TIMEOUT=600
      - SE_LOG_LEVEL=WARN
      # This standalone IS the whole pool, so it declares the pool side of the debug pin (#1108)
      # for parity with docker-compose.grid.yml: production sessions ask for `lem:debug=false` and
      # match here, a `--require-debug-node` probe asks for `true` and correctly finds nothing to
      # run on (this topology has no watchable node). Quote the whole KEY=value pair — see the
      # grid overlay for what quoting only the JSON does.
      - 'SE_NODE_STEREOTYPE_EXTRA={"lem:debug":false}'
    volumes:
      - chrome-profile:/home/seluser/chrome-profile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # ~1 vCPU + ~1-1.5g per healthy concurrent LinkedIn session; 8 sessions is the top of
          # the 8g / 8-vCPU Chrome budget documented in docs/scaling-plan.md §4. This is a
          # ceiling, not a reservation — Chrome only takes the whole box if nothing else wants it.
          cpus: '8.0'
          memory: 8g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4444/status | python3 -c \"import sys,json; d=json.load(sys.stdin); sys.exit(0 if any(n.get('availability')=='UP' for n in d['value']['nodes']) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    hostname: litellm
    ports:
      - "4000:4000"
    volumes:
      - ./.litellm:/app/.litellm
      # The complexity router's decision core, shared with the app so the weekly optimizer and the
      # router can never disagree about a bucket (issue #494). Mounted, not copied: this image has
      # no LEM package, and the module is deliberately stdlib-only for exactly that reason.
      - ./src/cqc_lem/utilities/routing_policy.py:/app/.litellm/routing_policy.py:ro
    # Gunicorn workers so LiteLLM can handle parallel requests safely (the Quin start.sh
    # pattern). Worker count is configurable and deliberately conservative for a VPS — see
    # docker-compose.prod.yml for the prod memory/CPU cap that keeps it from saturating the host.
    command: ["--config", "/app/.litellm/config.yaml", "--port", "4000", "--num_workers", "${LITELLM_NUM_WORKERS:-3}", "--run_gunicorn"]
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - OLLAMA_CLOUD_URL=${OLLAMA_CLOUD_URL}
      - OLLAMA_CLOUD_API_KEY=${OLLAMA_CLOUD_API_KEY}
      # lem-research (newsletter research grounding) routes to Perplexity Sonar
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      # Cost-aware down-routing (issue #494). OFF unless BOTH this and COST_ROUTING_ENABLED (app
      # side) are on. The Redis URL must point at the same instance the app publishes the policy to.
      - COST_AWARE_ROUTING_ENABLED=${COST_AWARE_ROUTING_ENABLED:-false}
      - COST_ROUTING_REDIS_URL=${COST_ROUTING_REDIS_URL:-redis://redis:6379/0}
      - COST_ROUTING_POLICY_TTL_SECONDS=${COST_ROUTING_POLICY_TTL_SECONDS:-60}
      # LLM analytics (issue #647): the native posthog callback in .litellm/config.yaml reads these
      # two names specifically. Same project key + host the app and the SPA report to, so a user's
      # $ai_generation lands on the same PostHog person as their llm_call and browser events.
      # Without POSTHOG_API_KEY the logger fails to initialize and LiteLLM swallows it as
      # non-blocking: calls still complete, they just emit no $ai_generation. Silent, so if the
      # events don't show up, check this env var in /opt/lem/.env first.
      - POSTHOG_API_KEY=${POSTHOG_API_KEY}
      - POSTHOG_API_URL=${POSTHOG_HOST:-https://us.i.posthog.com}
    restart: unless-stopped
    # VPS guardrail: cap LiteLLM's memory + CPU so gunicorn workers can't starve the host.
    # Tunable via env; prod overrides memory in docker-compose.prod.yml.
    deploy:
      resources:
        limits:
          memory: ${LITELLM_MEM_LIMIT:-1500m}
          cpus: "${LITELLM_CPU_LIMIT:-2.5}"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
  flower_db:
  chrome-profile:
