# Prompt registry — one entry per LLM call site (docs/prompt-evals.md).
#
# Keyed by `module:function#index` exactly as `python scripts/prompt_registry.py --scan` prints it.
# A call site the scan finds with no entry here fails tests/unit/benchmarks/test_prompt_registry.py.
#
# status: evaluated  — captured, versioned in prompts.lock.json, has a dataset and graders
#         planned    — tracked and versioned by source hash; dataset not written yet
#         exempt:<reason> — not graded here, and why
# family: post_longform | comment | own_comment | dm | classifier | json_planner | rewrite | summary | media_prompt | judge

# Grader defaults per family (docs/prompt-evals.md §4). Every row of an evaluated prompt in a family is
# scored by these; an entry's `assertions` and a row's own `assertions` add to them. `production`
# classes follow scripts/benchmark_models.py (#910): a contract failure is what the call site consumes,
# a repairable one is what production's regeneration gates retry. `rubric` names the model-grader
# rubric in rubrics/<rubric>.md; a family without one is graded by code only.
families:
  comment:
    rubric: comment
    assertions:
      - {type: no_preamble}
      - {type: max_chars, value: 700}
      - {type: comment_contract}
      - {type: slop_lint, content_type: comment}
      - {type: meeting_ask}
      - {type: ungrounded_metrics}
  own_comment:
    # The user's OWN first comment on their own post (seed / golden-hour wave). Production does not
    # run it through the third-party comment contract or the grounding gate — it lints it on the
    # `own_post_comment` surface — so neither is graded here.
    rubric: comment
    assertions:
      - {type: no_preamble}
      - {type: max_chars, value: 700}
      - {type: slop_lint, content_type: own_post_comment}
      - {type: meeting_ask}
  dm:
    rubric: dm
    assertions:
      - {type: no_preamble}
      - {type: max_chars, value: 300}
      - {type: slop_lint, content_type: dm}
      - {type: meeting_ask}
  post_longform:
    rubric: post_longform
    assertions:
      - {type: no_preamble}
      - {type: max_chars, value: 3000}
      - {type: slop_lint, content_type: post}
      - {type: min_burstiness, value: 0.3}
      - {type: meeting_ask}
      - {type: ungrounded_metrics}
      - {type: dwell, min_score: 40}
  classifier:
    assertions: []
  judge:
    assertions: []

