# ── Ollama Cloud roster (refreshed 2026-07-31, issue #717) ───────────────────────
# THREE things about this file that are easy to get wrong:
#  0. Ollama model ids on this path are the BARE catalog names — `gpt-oss:120b`, not
#     `gpt-oss:120b-cloud` and not `gpt-oss:120b:cloud`. OLLAMA_CLOUD_URL is the direct
#     ollama.com/v1 API (docs.ollama.com/cloud, "Cloud API access"), which serves exactly the ids
#     `ollama.com/api/tags` lists; the `-cloud` suffix is the `ollama pull` form for the LOCAL
#     runtime. An id that catalog has never listed 404s on every call — and under (1) a 404 is the
#     FASTEST answer in the group, so the broken deployment wins the race and takes the traffic.
#     That is how the retired ministral-3:8b kept winning lem-simple.
#     Careful: a WRONG-BUT-ACCEPTED spelling is the nastier case, because it does not 404. Probed
#     2026-08-01 (issue #844): `glm-5.2:cloud` and `glm-5.2:latest` both answer 200 and serve the
#     same model as bare `glm-5.2`, while `glm-5.2:bogus` 404s — so `:cloud`/`:latest` are tag
#     ALIASES the endpoint resolves, not typos it rejects. Nothing in the request path notices,
#     but everything that reads this file by id does: the catalog check, the advance-retirement
#     scan (scripts/model_health_check.py keys on the bare id and matches the retirement table
#     verbatim) and shadow-cost pricing all key on the exact string. Keep ids verbatim-catalog.
#  1. `routing_strategy: latency-based-routing` means the order of deployments inside a
#     model_name group is NOT a priority list — every deployment in the group competes and the
#     fastest wins. Order still matters for ONE thing: scripts/benchmark_models.py treats the
#     FIRST Ollama Cloud deployment of a tier as that tier's CHAMPION, i.e. the model a candidate
#     has to beat. So a model is promoted to the head of its group only after the benchmark says
#     so — never on a spec sheet.
#  2. Ollama's OpenAI-compat layer supports `response_format` json/json_schema but does NOT
#     support forced tool calls (`tool_choice`). No LEM call path sends tool_choice — keep it
#     that way, or the call will silently degrade on every Ollama deployment below. JSON output
#     is requested with response_format (see generate_carousel_content), not with a forced tool.
model_list:
  # ── SIMPLE tier: fast, lightweight — refine/summarize/list tasks ──────────────
  - model_name: lem-simple
    litellm_params:
      model: openai/gpt-oss:20b
      api_base: os.environ/OLLAMA_CLOUD_URL
      api_key: os.environ/OLLAMA_CLOUD_API_KEY
      max_parallel_requests: 8
      request_timeout: 90
      rpm: 100

  # NOTE: openai/ministral-3:8b was RETIRED 2026-07-15 (returns 410) and was removed — same
  # class of breakage as kimi-k2:1t below. Under latency-based routing it kept getting picked
  # (a 410 is "fast"), so a share of lem-simple calls failed; the profile scrape (lem-simple)
  # then aborted auto-commenting with "Profile unavailable". gpt-oss:20b stays primary, with
  # gpt-4o-mini as the in-group OpenAI fallback.

  # OpenAI fallback (when Ollama Cloud is unavailable)
  - model_name: lem-simple
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # ── MEDIUM tier: balanced capability ─────────────────────────────────────────
  - model_name: lem-medium
    litellm_params:
      model: openai/gpt-oss:120b
      api_base: os.environ/OLLAMA_CLOUD_URL
      api_key: os.environ/OLLAMA_CLOUD_API_KEY
      max_parallel_requests: 4
      request_timeout: 150
      rpm: 50

  # deepseek-v4-flash is GONE from this tier (#1758). `:preview` — the 140GB build benchmarked at
  # 90% contract here (#921) and the id this tier served since #1200 — left `ollama.com/api/tags`
  # entirely on 2026-08-30. Its only remaining sibling, `:0731`, is not a rename of that build (a
  # DIFFERENT digest on `ollama.com/api/tags`, which is build identity there) and it is not a fit
  # either way: it was already benchmarked beside `:preview` for #921 and declined below the 90%
  # contract floor on this tier (80%). Restoring the bare `deepseek-v4-flash` id would just follow
  # the vendor's moving tag onto that same declined build (#1201). Full history:
  # docs/model-benchmarks/README.md. A fresh candidate for this tier is tracked on #1758's
  # follow-up, gated on scripts/benchmark_models.py the same as every other adoption here.

  # gemma4:31b is a Low/Medium usage-level model with a 256K context — cheaper quota than the rest
  # of this tier, which is why it is in the group rather than replacing anything outright.
  - model_name: lem-medium
    litellm_params:
      model: openai/gemma4:31b
      api_base: os.environ/OLLAMA_CLOUD_URL
      api_key: os.environ/OLLAMA_CLOUD_API_KEY
      max_parallel_requests: 4
      request_timeout: 120
      rpm: 50

  # NOTE: openai/minimax-m2.7 was REMOVED 2026-07-31 (issue #717) — it is NOT retired, it is
  # stale: the catalog moved to minimax-m3 and the weekly model-health check re-files that family
  # gap every run. m3 is a HIGH usage-level model where m2.7 was MEDIUM, so following the family
  # would raise this tier's quota burn — an evaluation, never an auto-swap. Rather than pay that
  # for a tier that is not the quality anchor, lem-medium leaves the family: gpt-oss:120b
  # (champion) + gemma4:31b (Low/Medium) now cover it alone — deepseek-v4-flash's own decline is
  # the note right above.
  # The m3 / glm-5.2 quality question lives on for lem-complex, benchmark-gated.

  # OpenAI fallback
  - model_name: lem-medium
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # ── COMPLEX tier: long-form, high-quality content ────────────────────────────
  # NOTE: openai/kimi-k3 was EVALUATED and DECLINED 2026-08-02 (issue #921). It is not a quality
  # call and it was never benchmarked: the Ollama Cloud API answers HTTP 402 for it — "this model
  # uses extra usage only (not included plan usage)". Its page prices per token ($3.00/$15.00 per
  # 1M) instead of publishing a usage-level pip, so the benchmark reads its level as `unknown`,
  # which the #842 standing spend policy holds by default. Every deployment in this file is served
  # inside plan usage; kimi-k3 would move a tier onto metered extra-usage billing, which is an
  # owner spend decision, not a roster refresh. Re-evaluate only if the plan changes.
  # NOTE: openai/deepseek-v4-pro (`:0813` and `:preview`) was EVALUATED and DECLINED 2026-08-16
  # (issue #1583), unbenchmarked and deliberately so. It is an EXTRA HIGH usage-level model — +2
  # levels against every SERVING-tier Ollama deployment here, all of which are Low or Medium (the
  # lem-agent-* lane's glm-5.3 / minimax-m3 are HIGH, so +1 there) — and the
  # #842 standing spend policy buys a usage-level increase on this tier only, and only on a STRICT
  # judge-rate win over the champion. qwen3.5:397b's last measured judge rate here is 100%, so no
  # run can produce that win; it could only tie, at Extra-high metering per call. Unlike kimi-k3
  # above it IS inside plan usage — the objection is the quota class, not the billing model.
  # Re-open if qwen3.5:397b is ever re-measured below 100% judge on lem-complex.
  # NOTE: openai/kimi-k2:1t was RETIRED 2026-06-16 (returns 410) and was removed — it was
  # the primary here, so content generation fell through to the OpenAI/Anthropic fallbacks,
  # which fail when those keys aren't set. qwen3.5:397b (OLLAMA) is now primary.
  - model_name: lem-complex
    litellm_params:
      model: openai/qwen3.5:397b
      api_base: os.environ/OLLAMA_CLOUD_URL
      api_key: os.environ/OLLAMA_CLOUD_API_KEY
      max_parallel_requests: 3
      request_timeout: 240
      rpm: 30

  # deepseek-v4-flash:preview served this tier (AHEAD of the paid OpenAI/Anthropic fallbacks)
  # since #1200, but it is GONE as of #1758: the id left `ollama.com/api/tags` entirely and its
  # only sibling, `:0731`, is a different build (different `ollama.com/api/tags` digest, which is
  # build identity there) that was already benchmarked beside `:preview` for #921 and declined
  # below the 90% contract floor on this tier (80%). Restoring the bare `deepseek-v4-flash` id
  # would just follow the vendor's moving tag onto that same declined build (#1201).
  #
  # This tier now runs on ONE free Ollama deployment (qwen3.5:397b, still champion) plus the paid
  # fallbacks below until #1758's follow-up benchmarks a real replacement — deliberately not
  # `gemma4:31b` or the HIGH usage-level minimax-m3 / glm-5.2, all three already declined here on
  # #921/#842 (see docs/model-benchmarks/README.md). No candidate gets promoted onto this tier off
  # a spec sheet, only off scripts/benchmark_models.py.

  # OpenAI fallback
  - model_name: lem-complex
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  # Claude fallback — activated once ANTHROPIC_API_KEY is configured
  - model_name: lem-complex
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  # ── RESEARCH: web-grounded current facts via Perplexity Sonar ────────────────
  # Used by newsletter_research.research_newsletter_topic (one call per edition) to ground
  # editions in current stats/examples. Falls back in code to the direct Perplexity helper.
  - model_name: lem-research
    litellm_params:
      model: perplexity/sonar
      api_key: os.environ/PERPLEXITY_API_KEY
      request_timeout: 60
      rpm: 20

  # ── IMAGE generation — no Ollama Cloud equivalent; OpenAI GPT-Image ─────────
  # gpt-image-2 is the hero renderer for every non-avatar image (covers, post images,
  # thumbnails); avatar likeness stays on the Replicate FLUX LoRA path, and base FLUX is the
  # code-side fallback when this whole group is down (utilities/ai/image_gen.py). gpt-image-2
  # can require verified-org API access, so gpt-image-1 rides in the same group — latency
  # routing plus num_retries lands calls there when -2 refuses. These models return b64_json
  # only (no response_format='url'), which image_gen.py decodes and persists.
  - model_name: lem-image
    litellm_params:
      model: openai/gpt-image-2
      api_key: os.environ/OPENAI_API_KEY
      request_timeout: 180

  - model_name: lem-image
    litellm_params:
      model: openai/gpt-image-1
      api_key: os.environ/OPENAI_API_KEY
      request_timeout: 180

  # ── VISION: render quality gate (image_gen.inspect_render_quality). Cheap look at a
  # generated image — relevance + artifact check before it reaches review. Ollama Cloud's
  # roster has no vision model, so this is OpenAI-only; callers fail OPEN when it errors.
  - model_name: lem-vision
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      request_timeout: 60

  # ── TTS: tutorial voice-over (issue #505). tts-1 is the cheapest useful option
  # ($15 / 1M characters) and streams straight back as mp3 bytes.
  - model_name: lem-tts
    litellm_params:
      model: openai/tts-1
      api_key: os.environ/OPENAI_API_KEY

  # ── EMBEDDING: cheap vectors for feedback dedup/clustering (issue #498) ──────
  # DO NOT move this to Ollama Cloud "for consistency": Ollama Cloud serves ZERO embedding models
  # (it is a chat/completions roster only), so there is nothing to move it to — every roster
  # refresh re-checks this and the answer has not changed. text-embedding-3-small is the cheapest
  # useful option. Callers MUST tolerate this being unavailable — feedback dedup, the comment
  # similarity gate and content-quality scoring all fall back to token overlap.
  - model_name: lem-embedding
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

  # ── ROUTER: auto-routes by prompt complexity via LEMComplexityRouter hook ─────
  - model_name: lem-router
    litellm_params:
      model: openai/gpt-oss:20b
      api_base: os.environ/OLLAMA_CLOUD_URL
      api_key: os.environ/OLLAMA_CLOUD_API_KEY
      max_parallel_requests: 6
      request_timeout: 90

  - model_name: lem-router
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # ── AGENT TIERS: Ollama Cloud models that back the agent-pipeline's Ollama lane ─
  # The agent-pipeline (scripts/agent-pipeline/tick.sh) runs the Claude Code CLI headless to
  # work GitHub issues. Its PRIMARY lane is the owner's Claude Max subscription (no LiteLLM).
  # When that subscription is constrained/exhausted, or to run issues in PARALLEL, the Ollama
  # lane points the SAME `claude -p` CLI at LiteLLM (ANTHROPIC_BASE_URL=http://127.0.0.1:4000,
  # ANTHROPIC_AUTH_TOKEN=$LITELLM_MASTER_KEY) with --model = one of these aliases. LiteLLM serves
  # the Anthropic /v1/messages endpoint and translates to the underlying Ollama Cloud model.
  # CLOUD-ONLY by policy (Ollama Max subscription) — no local models on this path.
  #   tier1   glm-5.3         hardest long-horizon / architecture / multi-step plans
  #   tier2   kimi-k2.7-code  default coding / patches / tests / multi-file edits
  #   tier2a  minimax-m3      premium parallel / vision-capable alternate
  #   tier3   nemotron-3-super fallback / reviewer / reasoning lane
  # These four carried a `:cloud` tag until #844. It served fine (see note 0 — the endpoint
  # resolves `:cloud` as a tag alias), but it is not what the catalog lists, so the advance-
  # retirement scan could not see them. Bare ids now, like every tier above. Their price-snapshot
  # entries keep the roster uniform and price them from day one if one is promoted into a serving
  # tier; this lane's own cost is LiteLLM's `$ai_generation`, not the app's `llm_call`.
  # See docs/agent-pipeline-routing.md for the capacity-aware lane-selection rule.
  # glm-5.2 -> glm-5.3 (issue #1756, 2026-08-30): ADOPTED. Same High(3) usage level as glm-5.2 (no
  # quota-burn increase), and the ollama.com model page reports the swap is post-training on the
  # SAME base model, aimed squarely at this tier's job — "Terminal-Bench 3.0 improves from 4.6 to
  # 28.3" and "SWE-Marathon more than doubles (19.4 -> 42.5)", explicitly called out for coding
  # agent applications including Claude Code. Not the #842 spend-policy case (that gates a USAGE-
  # LEVEL INCREASE, which this isn't) — a flat-quota quality win on the tier's own workload.
  - model_name: lem-agent-tier1
    litellm_params:
      model: openai/glm-5.3
      api_base: os.environ/OLLAMA_CLOUD_URL
      api_key: os.environ/OLLAMA_CLOUD_API_KEY
      max_parallel_requests: 2
      request_timeout: 300
      rpm: 20

  - model_name: lem-agent-tier2
    litellm_params:
      model: openai/kimi-k2.7-code
      api_base: os.environ/OLLAMA_CLOUD_URL
      api_key: os.environ/OLLAMA_CLOUD_API_KEY
      max_parallel_requests: 4
      request_timeout: 240
      rpm: 40

  - model_name: lem-agent-tier2-alt
    litellm_params:
      model: openai/minimax-m3
      api_base: os.environ/OLLAMA_CLOUD_URL
      api_key: os.environ/OLLAMA_CLOUD_API_KEY
      max_parallel_requests: 4
      request_timeout: 240
      rpm: 40

  - model_name: lem-agent-tier3
    litellm_params:
      model: openai/nemotron-3-super
      api_base: os.environ/OLLAMA_CLOUD_URL
      api_key: os.environ/OLLAMA_CLOUD_API_KEY
      max_parallel_requests: 4
      request_timeout: 180
      rpm: 40

router_settings:
  routing_strategy: latency-based-routing
  num_retries: 2
  retry_after: 5
  fallbacks:
    - lem-complex:
        - lem-medium
        - lem-simple
    - lem-medium:
        - lem-simple
    # Ollama lane degrades a hard task through cheaper cloud tiers before failing.
    - lem-agent-tier1:
        - lem-agent-tier2
        - lem-agent-tier3
    - lem-agent-tier2:
        - lem-agent-tier3
    - lem-agent-tier2-alt:
        - lem-agent-tier3

litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
  custom_callbacks:
    - /app/.litellm/complexity_router.py
    # Keeps $ai_generation under PostHog's per-request ceiling (issue #1310). LiteLLM attaches the
    # full retry history as `previous_models` — measured at 725 KB of a 760 KB event — which
    # `turn_off_message_logging` below does NOT reach, because it rides in request metadata rather
    # than standard_logging_object. A 413 on /batch/ drops all 100 events silently, so the money
    # numbers were a floor. Installs at import; fails open to today's behaviour.
    - /app/.litellm/posthog_payload_guard.py
  # ── LLM analytics → PostHog (issue #647, docs/llm-analytics.md) ──────────────
  # LiteLLM's native logger (>=1.77.3) emits ONE $ai_generation / $ai_embedding per call with the
  # provider model, tokens, response_cost and latency — the proxy's own accounting, so it needs no
  # app-side estimate. distinct_id comes from the request's `metadata.user_id`, which
  # utilities/ai/client.py stamps on every lem-* call; every other metadata key (feature) rides
  # along as an event property. Needs POSTHOG_API_KEY in this container — see docker-compose.yml.
  # The app's own `llm_call` event stays: it is what the cost ledger and margin report are built on.
  # Do NOT sum spend across both streams — see the doc for which insight uses which.
  success_callback: ["posthog"]
  failure_callback: ["posthog"]
  # Prompts and completions are the USER'S LinkedIn material (profile synthesis, story-bank
  # anecdotes, draft DMs), so this was `true` from #647 until 2026-09-01. It is now FALSE, and that
  # is a deliberate decision, not a default: $ai_input/$ai_output_choices carry the full text into
  # PostHog. What it buys is the only thing that can grade OUTPUT quality — online evaluations that
  # read the comment we actually published. A trace audit found the drafter inventing first-person
  # metrics ("we cut errors from 1,200/wk to 300") and commenting on posts whose body never
  # arrived; neither is visible from tokens/cost/latency, and both ship publicly under the user's
  # name. Redaction is what made them unmeasurable.
  #
  # Two things this does NOT change:
  #  - the SPA still masks the same content client-side (maskProps()); this is the proxy leg only.
  #  - redaction never covered the model's own `reasoning` field, which rides in
  #    provider_specific_fields and reaches PostHog either way. The audit read the fabricated
  #    numbers off exactly that field WHILE this said `true`, so the pre-change privacy posture was
  #    weaker than the comment above claimed.
  #
  # Flip back to true to restore full redaction; nothing else in the pipeline reads this.
  turn_off_message_logging: false
  drop_params: true
  request_timeout: 180

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
