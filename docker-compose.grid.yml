# Selenium Grid overlay — Phase 2 of docs/scaling-plan.md (issue #556).
#
# The base file runs ONE `selenium/standalone-chrome` with 8 session slots. That is the top of this
# box's Chrome budget (§4): the next capacity increase has to be horizontal, not a bigger number.
# This overlay swaps that single container for a **hub + N single-session nodes**, so sessions scale
# with node count and nodes can be moved to a second VPS without touching the app tier —
# `get_docker_driver()` already targets `${SELENIUM_HUB_HOST}:${SELENIUM_HUB_PORT}/wd/hub`, which is
# the hub's address as much as it was the standalone's.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.grid.yml up -d
#
# NOT enabled by default. Prod runs the standalone until the capacity monitor (§5e) says the cap is
# the operating point; see docs/SELENIUM_GRID.md for the cutover runbook and the load-test evidence
# that should precede it.
#
# INVARIANT (same one the standalone carries): total session slots == the sum of every lane
# worker's SELENIUM_CONCURRENCY. Here total slots = SELENIUM_GRID_NODES x SE_NODE_MAX_SESSIONS(=1),
# so the default node count IS the cap: 8 nodes = se_engage 3 + se_prepost 2 + se_outreach 2 +
# se_content 1. Raising the node count without raising the lanes buys idle nodes; raising the lanes
# without the nodes makes tasks queue on session creation and miss their window. Change both in the
# same commit — tests/unit/app/test_selenium_capacity.py fails the build if they drift.
services:
  selenium-hub:
    image: selenium/hub:latest
    container_name: selenium-hub
    hostname: selenium-hub
    ports:
      # Same port as the standalone, so SELENIUM_HUB_PORT and every tool that speaks to it
      # (tools/selenium_mcp_server.py, the capacity monitor's /status poll) are unchanged. Bound to
      # LOOPBACK by default because this overlay composes after docker-compose.prod.yml, whose whole
      # point for `ports` is that 4444 is not publicly reachable — a default of "all interfaces"
      # here would silently undo that hardening on the cutover.
      # NOTE: there is no 7900 on a hub. noVNC lives on the NODES, and replicas cannot publish the
      # same host port — which is why the pool is unwatchable and `selenium-node-debug` below is a
      # separate, non-replicated node that DOES publish 7900.
      - "${SELENIUM_GRID_HUB_BIND:-127.0.0.1}:${SELENIUM_HUB_PORT}:4444"
      # Event bus. Only nodes speak these, and node-on-the-same-box reaches them over the compose
      # network without any publishing at all — so the default bind is loopback. Set
      # SELENIUM_GRID_BUS_BIND to the box's PRIVATE (WireGuard/VPC) address, never 0.0.0.0, when
      # nodes live on a second host: an internet-reachable event bus is an unauthenticated way to
      # register a node into the Grid. See docs/SELENIUM_GRID.md.
      - "${SELENIUM_GRID_BUS_BIND:-127.0.0.1}:4442:4442"
      - "${SELENIUM_GRID_BUS_BIND:-127.0.0.1}:4443:4443"
    environment:
      - SE_LOG_LEVEL=WARN
      # How long a new-session request may sit in the hub's queue before it is rejected. The
      # standalone had no queue — a request either got a slot or blocked in the client. Keep this
      # comfortably longer than a Chrome startup burst but shorter than the 15-minute windows the
      # lanes are trying to hit, so a starved Grid surfaces as an error, not as a silent 10-minute stall.
      - SE_SESSION_REQUEST_TIMEOUT=300
      - SE_SESSION_RETRY_INTERVAL=5
    restart: unless-stopped
    networks:
      default:
        aliases:
          # Answer to the STANDALONE's name too. Everything that predates the Grid points at
          # `selenium-chrome:4444` — the Cloudflare tunnel's lemgrid hostname (dashboard-managed,
          # not in this repo), SELENIUM_HUB_HOST in the box .env, and host-side tooling. Without
          # this alias the cutover 502s the Grid console and silently strips those callers of a
          # hub. The standalone service is profile-parked, so the name is free.
          - selenium-chrome
    deploy:
      resources:
        limits:
          # The hub only routes — it runs no browser (§5b: ~0.5 vCPU / 512 MB).
          cpus: '0.5'
          memory: 512m
    healthcheck:
      # Same MEANING as the standalone's check — a hub that answers but has zero nodes registered has
      # zero capacity, so "UP" must mean "a browser can actually start" — but pure shell rather than
      # the standalone's `python3 -c`: selenium/hub is a JRE image and carries no Python, so a check
      # that shelled out to it would make the hub permanently unhealthy and strand every service that
      # depends on it. `tr -d` first so the probe doesn't depend on how the hub spaces its JSON.
      test: ["CMD-SHELL", "curl -fsS http://localhost:4444/status | tr -d ' \\n' | grep -q '\"availability\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  selenium-node-chrome:
    image: selenium/node-chrome:latest
    # No container_name: this service is replicated, and Compose refuses to scale a named service.
    # Nodes are addressed by the hub over the event bus, never by us, so they need no stable name.
    # No chrome-profile volume either — a named volume shared by N replicas is one profile
    # directory with N Chromes writing into it, which corrupts it. Each node gets its own.
    shm_size: 2g
    depends_on:
      # service_started, NOT service_healthy: the hub is only "healthy" once a node has registered,
      # so waiting for health here would deadlock the pair. Nodes retry the bus on their own.
      selenium-hub:
        condition: service_started
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      # ONE session per node is the whole point of the horizontal path: a crashed Chrome takes down
      # one session instead of all of them, and capacity is added by adding nodes (here or on a
      # second box), not by raising a number inside a single container.
      - SE_NODE_MAX_SESSIONS=1
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
      - SE_NODE_SESSION_TIMEOUT=600
      - SE_LOG_LEVEL=WARN
      # The POOL half of the debug pin (#1301). Grid's DefaultSlotMatcher only compares an
      # extension capability the node's stereotype actually DECLARES, so declaring `false` here is
      # what makes a `lem:debug=true` request land on the debug node and NOWHERE else. Without it
      # a probe asking for the debug node still matches all 8 of these, and the capability is
      # decoration. Note the outer single quotes are around the WHOLE `KEY=value` pair: quoting
      # only the value hands the JSON to the node with literal `'` characters, which is what made
      # the debug node's own merge fail silently for weeks ("Failed to merge
      # SE_NODE_STEREOTYPE_EXTRA ... Keep using main stereotype").
      - 'SE_NODE_STEREOTYPE_EXTRA={"lem:debug":false}'
    restart: unless-stopped
    deploy:
      # Total slots = replicas x SE_NODE_MAX_SESSIONS. 8 == the summed lane concurrency (see the
      # invariant at the top) and is drop-in parity with the standalone it replaces.
      # `deploy.replicas` is honoured by `docker compose up` in Compose **v2** (v1 ignored the whole
      # `deploy` key outside Swarm — as it also would for the resource limits the base compose file
      # already relies on). Because a wrong node count is a silent capacity regression, not an error,
      # the cutover VERIFIES the slot count against /status before trusting it, and
      # `--scale selenium-node-chrome=$SELENIUM_GRID_NODES` is the explicit override if a host ever
      # disagrees. See docs/SELENIUM_GRID.md §2.
      replicas: ${SELENIUM_GRID_NODES:-8}
      resources:
        limits:
          # §5b's budget: ~1 vCPU / 1.5 GB + 2 GB shm per additional concurrent session. Note this
          # costs MORE RAM than the standalone for the same 8 sessions (8 x 1.5 GB + 8 node JVMs
          # vs one 8 GB container) — that extra is what buys fault isolation and the second box.
          cpus: '1.0'
          memory: 1536m

  # The watchable node — deliberately a NINTH, on top of the eight the lanes are sized for.
  # Owner decision 2026-07-27: at current user counts a spare browser is cheaper than losing a
  # production slot to debugging, and the capacity monitor (`auto_capacity_watch`) is what says
  # when the box needs more. So it is EXCLUDED from the cap == Σ-lanes invariant on purpose: the
  # lanes can still only ask for 8 concurrent sessions, and this node exists to absorb the ad-hoc
  # ones (MCP debugging, live-validation probes, a session you want to watch) without ever
  # competing with automation for a slot.
  #
  # Since #1301 the pin is DETERMINISTIC, in both directions: this node declares `lem:debug=true`
  # and every pool node declares `lem:debug=false`, so a client asking for `true` can only land
  # here and a production session (which asks for `false` — see `apply_debug_node`) can never land
  # here. That is what lets an autonomous agent run the read-only live probe without ever taking a
  # slot the Celery lanes are sized for.
  selenium-node-debug:
    image: selenium/node-chrome:latest
    container_name: selenium-node-debug
    hostname: selenium-node-debug
    # TWO sessions, sized for the two consumers that genuinely overlap (#1301): a probe run — the
    # weekly drift sweep is the long one, minutes of Chrome — and an agent or the owner opening the
    # Selenium MCP browser to look at a page. At ONE, the Monday sweep made every agent browser
    # request fail for the length of it, and two agents contended with each other. A third
    # concurrent debug session is not a workload this box has; it is refused IMMEDIATELY (the
    # free-slot check in `apply_debug_node` runs before the session request) rather than sitting in
    # the hub's 300s queue, which reads as a hang. shm/cpu/memory below are 2x the pool node's
    # per-session budget to match — see docs/scaling-plan.md §5b.
    shm_size: 4g
    depends_on:
      selenium-hub:
        condition: service_started
    ports:
      # noVNC. Loopback by default like every other port in the prod overlay; the Cloudflare tunnel
      # reaches it over the compose network by service name, not through this publish.
      - "${SELENIUM_GRID_VNC_BIND:-127.0.0.1}:7900:7900"
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      # NOT part of the `cap == Σ lane concurrency` invariant — that arithmetic is keyed on the
      # POOL (`selenium-node-chrome` replicas) alone, and these sessions are on top of it. The
      # lanes can still only ask for 8, and they can no longer land here at all.
      - SE_NODE_MAX_SESSIONS=2
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
      - SE_NODE_SESSION_TIMEOUT=600
      - SE_LOG_LEVEL=WARN
      # Distinguish this node from the pool with a custom capability so clients can
      # request it deliberately. SE_NODE_STEREOTYPE_EXTRA merges into the default
      # browser stereotype instead of replacing it. See docs/SELENIUM_GRID.md.
      # The quotes wrap the WHOLE `KEY=value` pair on purpose: written as
      # `SE_NODE_STEREOTYPE_EXTRA='{...}'` the single quotes are part of the VALUE (compose does no
      # shell parsing here), the node's json_merge.py rejects it, and it logs "Failed to merge
      # SE_NODE_STEREOTYPE_EXTRA ... Keep using main stereotype" and registers with an ordinary
      # stereotype. That is exactly what happened between #753 and #1301: `--watch` looked
      # implemented, matched every node, and pinned nothing. `test_selenium_debug_node.py` now
      # json.loads() this value so the same typo cannot come back.
      - 'SE_NODE_STEREOTYPE_EXTRA={"lem:debug":true}'
      # The name this node REGISTERS under, so `/status` reports its uri as
      # `http://selenium-node-debug:5555` instead of a per-restart container IP. That is what lets
      # the capacity monitor drop this node from the saturation denominator
      # (`capacity_alerts._pool_slots`) — without it the ninth slot silently dilutes the one signal
      # that says the pool is the constraint. Resolvable because compose aliases the service name.
      - SE_NODE_HOST=selenium-node-debug
      # The URL the Grid UI builds this node's live-view (noVNC) link from. It must be the address
      # the OPERATOR'S BROWSER can reach — the tunnel hostname — not the compose-internal one, or
      # the console renders a link to a host that only exists inside Docker. Left at the internal
      # default when unset: the node still works, only the UI's live-view shortcut does not.
      - SE_NODE_GRID_URL=${SELENIUM_GRID_PUBLIC_URL:-http://selenium-hub:4444}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # 2x the pool node's per-session budget, because this node runs 2 sessions. A session
          # that cannot get a core runs slowly enough to look non-human to LinkedIn — the same
          # reason the pool is sized this way — and that applies to a probe as much as to a lane.
          # Costs the box +1 vCPU / +1.5 GB against the previous single-session node.
          cpus: '2'
          memory: 3072m

  # The standalone is retired by this overlay, not deleted: `profiles` keeps it defined (so
  # `docker compose -f ... -f docker-compose.grid.yml --profile standalone up selenium-chrome` can
  # still bring it back for an instant rollback) while excluding it from a normal `up`.
  selenium-chrome:
    profiles: ["standalone"]

  # Every service that waited on the standalone now waits on the hub, and points at it. `!override`
  # replaces the whole depends_on map rather than merging into it — a merged map would still name
  # selenium-chrome, which this overlay has profiled out. SELENIUM_HUB_HOST is set per-service
  # because `environment` beats `env_file`, so .env's `selenium-chrome` default needs no edit.
  celery_worker:
    environment:
      - SELENIUM_HUB_HOST=selenium-hub
    depends_on: !override
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      selenium-hub:
        condition: service_healthy

  celery_worker_selenium:
    environment:
      - SELENIUM_HUB_HOST=selenium-hub
    depends_on: !override
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      selenium-hub:
        condition: service_healthy

  celery_worker_selenium_prepost:
    environment:
      - SELENIUM_HUB_HOST=selenium-hub
    depends_on: !override
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      selenium-hub:
        condition: service_healthy

  celery_worker_selenium_outreach:
    environment:
      - SELENIUM_HUB_HOST=selenium-hub
    depends_on: !override
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      selenium-hub:
        condition: service_healthy

  celery_worker_selenium_content:
    environment:
      - SELENIUM_HUB_HOST=selenium-hub
    depends_on: !override
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      selenium-hub:
        condition: service_healthy

  celery_beat:
    environment:
      - SELENIUM_HUB_HOST=selenium-hub
    depends_on: !override
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      selenium-hub:
        condition: service_healthy
