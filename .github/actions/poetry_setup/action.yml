name: "Poetry Setup"
description: "Set up Python with Poetry and restore cached virtual environment"

inputs:
  python-version:
    description: "Python version to use"
    required: false
    default: "3.12"
  poetry-version:
    description: "Poetry version to install"
    required: false
    default: "1.8.3"
  working-directory:
    description: "Working directory for Poetry install"
    required: false
    default: "."
  install-args:
    description: "Extra arguments for poetry install (e.g. --with test)"
    required: false
    default: "--with test"

runs:
  using: "composite"
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ inputs.poetry-version }}
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true

    # Restore and save are split so we can choose NOT to save. Actions caches are scoped to the ref
    # that wrote them (plus the default branch as a fallback), so an entry written from
    # refs/pull/<n>/merge is readable by that one PR and nothing else. This action ran on ~7 jobs
    # per PR and saved on all of them: 17 live entries x ~352 MB, ~6 GB of the repo's 10 GB budget,
    # write-only. Over the limit GitHub evicts least-recently-used — and the entry it evicted was
    # main's, the one every branch CAN read. That is why the step still cost 19-29s on a "cache hit".
    - name: Restore Poetry virtual environment
      id: cache-venv
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.working-directory }}/.venv
        key: venv-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles(format('{0}/poetry.lock', inputs.working-directory)) }}-${{ inputs.install-args }}
        restore-keys: |
          venv-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles(format('{0}/poetry.lock', inputs.working-directory)) }}-
          venv-${{ runner.os }}-${{ inputs.python-version }}-

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # An EXACT key hit means both the lockfile and the install-args match, so the restored
        # .venv already IS what `poetry install` would produce and the install was pure overhead.
        # It is probed before being trusted: .venv/bin/python symlinks into the setup-python
        # install, which a runner-image bump can leave dangling. A failed probe falls through to a
        # real install rather than failing the job. A restore-keys (partial) hit is NOT an exact
        # hit and always reinstalls -- that is the path Dependabot's lockfile bumps take.
        #
        # The python-import probe alone is NOT enough: a cache entry can restore with a working
        # interpreter but a missing group console-script (observed 2026-08-18 -- every job with
        # `--with test` hit "Command not found: pytest" despite an exact cache-hit, main included).
        # So also probe for the one script each group exists to provide.
        group_bin_ok=true
        case "${{ inputs.install-args }}" in
          *test*) [ -x .venv/bin/pytest ] || group_bin_ok=false ;;
          *lint*) [ -x .venv/bin/ruff ] || group_bin_ok=false ;;
        esac
        if [ "${{ steps.cache-venv.outputs.cache-hit }}" = "true" ] \
           && [ "$group_bin_ok" = "true" ] \
           && poetry run python -c "import sys" >/dev/null 2>&1; then
          echo "Restored venv matches poetry.lock and ${{ inputs.install-args }} — skipping install"
        else
          poetry install ${{ inputs.install-args }} --no-interaction
        fi

    # Save from main and NOTHING else. An Actions cache is scoped to the ref that wrote it, with the
    # default branch as the only fallback every other ref can read — so main's entry is the only one
    # ever worth writing.
    #
    # `merge_group` was allowed here originally and that was wrong: the queue's
    # `gh-readonly-queue/main/pr-<n>-<sha>` branch is DELETED the moment its entry merges, so a cache
    # written from one is orphaned on creation. Measured on the first batch after this shipped — six
    # entries at ~352 MB, ~2.1 GB, none of it readable again. A merge_group run has no need to write:
    # it already restores main's entry through the default-branch fallback.
    - name: Save Poetry virtual environment
      if: >-
        steps.cache-venv.outputs.cache-hit != 'true' &&
        github.ref == 'refs/heads/main'
      uses: actions/cache/save@v5
      with:
        path: ${{ inputs.working-directory }}/.venv
        key: venv-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles(format('{0}/poetry.lock', inputs.working-directory)) }}-${{ inputs.install-args }}
