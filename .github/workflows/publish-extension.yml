name: Publish Browser Extension

# Manual-only: never runs on push, PR, or release. Nothing ships to the Chrome Web Store
# until someone explicitly triggers this from Actions → Run workflow. See
# docs/CHROME_WEB_STORE.md for one-time setup and the required secrets.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Submit for review after upload (false = upload as draft only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build store zip
        run: python scripts/package_extension.py

      - name: Resolve artifact path
        id: art
        run: echo "zip=$(ls dist/lem-linkedin-connect-v*.zip | head -1)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Upload to Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ -z "$EXTENSION_ID" ] || [ -z "$CLIENT_ID" ]; then
            echo "::error::Chrome Web Store secrets are not configured. See docs/CHROME_WEB_STORE.md."
            exit 1
          fi
          npx --yes chrome-webstore-upload-cli@3 upload \
            --source "${{ steps.art.outputs.zip }}" \
            --extension-id "$EXTENSION_ID" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --refresh-token "$REFRESH_TOKEN"

      - name: Submit for review
        if: ${{ inputs.publish }}
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          npx --yes chrome-webstore-upload-cli@3 publish \
            --extension-id "$EXTENSION_ID" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --refresh-token "$REFRESH_TOKEN"
