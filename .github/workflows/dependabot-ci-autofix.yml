name: Dependabot CI Auto-Fix Router

# When a Dependabot PR's CI fails, route the fix to the Claude pipeline (label agent:depfix)
# instead of spending Copilot coding-agent credits with "@copilot fix". The local Claude runner
# picks up agent:depfix PRs in a PRIORITY lane, smart-triages the failure (fix the bump on-branch,
# or open a main-side fix PR + @dependabot rebase when it isn't the bump's fault), then clears the
# label. Copilot remains the (free) reviewer only.

# The list below must cover every workflow that can BLOCK a merge, or the lane is deaf to the
# failures that matter. It previously watched four workflows while branch protection required six
# checks, four of which come from workflows that were NOT here — including `UI Build`, which is the
# single likeliest way an npm group bump breaks this repo. A Dependabot PR failing one of those went
# red with no label and no agent, indistinguishable from the lane never firing.
#
# `workflow_run.workflows` matches a workflow's `name:` field, not a check name. Keep this list in
# step with the required contexts on `main`.
on:
  workflow_run:
    workflows:
      # Required checks on main
      - "CI / Unit Tests"                     # Unit Tests (Python 3.12)
      - "CI / Integration Test w/ Coverage"   # Integration Tests
      - "UI Build"                            # UI Build
      - "GitGuardian Security Scan"           # GitGuardian Scan
      - "Migration Versions"                  # Migration Versions
      - "CodeQL PR Gate"                      # CodeQL PR Quality Gate
      # Not required, but a failure here is still worth an agent's attention
      - "CI / E2E Test w/ Coverage"
      - "CodeQL Advanced"
    types:
      - completed

jobs:
  route-to-claude:
    name: Route Dependabot CI failure to the Claude pipeline
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Label the failing Dependabot PR for Claude
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${run.head_repository.owner.login}:${run.head_branch}`,
              state: 'open',
            });
            if (pulls.data.length === 0) return;
            const pr = pulls.data[0];
            if (pr.user.login !== 'dependabot[bot]') {
              console.log(`#${pr.number} is not a Dependabot PR — skipping.`);
              return;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['agent:depfix'],
            });
            console.log(`Labeled #${pr.number} agent:depfix — Claude pipeline will handle it.`);
