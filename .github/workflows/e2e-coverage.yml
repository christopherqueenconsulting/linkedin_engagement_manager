name: CI / E2E Test w/ Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

# Supersede a PR's own in-flight runs when it is pushed to again. cancel-in-progress is gated to
# pull_request ON PURPOSE: these workflows also run on merge_group, and cancelling a merge-queue run
# fails that queue entry and evicts the PR -- the #1168/#1171 failure mode. It also protects the
# push:main runs that codeql_pr_gate.py's base-ref calibration reads from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    # E2E is informational — does not block merge
    continue-on-error: true

    env:
      OPENAI_API_KEY: test-key-not-real
      LITELLM_BASE_URL: http://localhost:4000
      LITELLM_MASTER_KEY: test-master-key
      BASE_URL: http://localhost:8000
      # Passed when the secret is configured for this branch/environment.
      # When unset, pytest_collection_modifyitems auto-skips requires_replicate tests.
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      REPLICATE_USERNAME: ${{ secrets.REPLICATE_USERNAME }}
      # When unset, pytest_collection_modifyitems auto-skips requires_capsolver tests.
      CAPSOLVER_API_KEY: ${{ secrets.CAPSOLVER_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Poetry and dependencies
        uses: ./.github/actions/poetry_setup
        with:
          python-version: "3.12"
          install-args: --with test

      # 25s of this 75s lane was re-downloading a browser that never changes between runs. Keyed on
      # the Playwright version resolved in poetry.lock, because that is what decides which browser
      # build `playwright install` wants — a key on the lockfile hash alone would miss on every
      # unrelated dependency bump. Saved from main only, for the same reason poetry_setup is: an
      # Actions cache is scoped to the ref that wrote it, so a per-PR entry is readable by that one
      # PR and does nothing but evict main's.
      - name: Resolve the pinned Playwright version
        id: pw
        run: echo "version=$(poetry run playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      # --with-deps installs apt system libraries, which live outside ~/.cache and are therefore NOT
      # restored by the cache. That half always has to run; only the browser download is skipped.
      - name: Install Playwright browsers
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            poetry run playwright install-deps chromium
          else
            poetry run playwright install --with-deps chromium
          fi

      # main only, for the reason spelled out in poetry_setup: a merge-queue ref is deleted on merge,
      # so a cache written from one is orphaned immediately, and a merge_group run can already read
      # main's entry through the default-branch fallback.
      - name: Save Playwright browsers
        if: >-
          steps.pw-cache.outputs.cache-hit != 'true' &&
          github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Start FastAPI test server
        run: |
          poetry run uvicorn cqc_lem.api.main:app --host 0.0.0.0 --port 8000 &
          # Wait for the server to accept connections
          for i in $(seq 1 10); do
            curl -sf http://localhost:8000/health && break || sleep 2
          done
        env:
          MYSQL_HOST: ""
          MYSQL_USER: ""
          MYSQL_PASSWORD: ""
          MYSQL_DATABASE: ""
          OPENAI_API_KEY: test-key-not-real
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          REPLICATE_USERNAME: ${{ secrets.REPLICATE_USERNAME }}

      - name: Run E2E tests
        run: |
          set +e
          poetry run pytest tests/e2e \
            -v --tb=short \
            -m e2e \
            --cov=src/cqc_lem \
            --cov-report=xml
          rc=$?
          set -e
          # Exit code 5 = no tests collected; treat as passing
          [ $rc -eq 5 ] && echo "No E2E tests collected — skipping" && exit 0 || exit $rc

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: e2e
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
