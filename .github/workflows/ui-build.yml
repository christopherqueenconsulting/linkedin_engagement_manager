name: UI Build

# Strict `npm ci` + production build (what the Docker image does) on every PR AND in the merge
# queue — so a dependency change that breaks the image fails CI instead of breaking release/deploy.

on:
  pull_request:
  merge_group:

# Supersede a PR's own in-flight runs when it is pushed to again. cancel-in-progress is gated to
# pull_request ON PURPOSE: these workflows also run on merge_group, and cancelling a merge-queue run
# fails that queue entry and evicts the PR -- the #1168/#1171 failure mode. It also protects the
# push:main runs that codeql_pr_gate.py's base-ref calibration reads from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui-build:
    name: UI Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/cqc_lem/ui/package-lock.json
      - name: npm ci (strict — matches the Docker build)
        working-directory: src/cqc_lem/ui
        run: npm ci

      # Cheaper and earlier than the bundle canary below: the canary can only fire once a build has
      # inlined the value, this fires on the diff that reintroduces the read. Both, because they
      # fail on different mistakes — a source read here, a build-arg or a transitive dep there.
      - name: No LEM-issued shared secret read by the SPA source
        working-directory: src/cqc_lem/ui
        run: |
          set -u
          # What Vite inlines is a READ — `import.meta.env.VITE_X`, bracketed, or destructured off
          # `import.meta.env` (a bundler's `process.env.VITE_X` counts the same). NAMING one is not
          # a read: src/api/client.ts documents the retired VITE_API_TOKEN on purpose, and a grep
          # for the bare name fails on the very comment that records why it is gone.
          pattern='(import\.meta|process)\.env\.(VITE_API_TOKEN|VITE_ADMIN_SECRET)\b'
          pattern="$pattern"'|(import\.meta|process)\.env\[[^]]*(VITE_API_TOKEN|VITE_ADMIN_SECRET)'
          pattern="$pattern"'|\{[^}]*(VITE_API_TOKEN|VITE_ADMIN_SECRET)[^}]*\}[[:space:]]*=[[:space:]]*(import\.meta|process)\.env'

          # Positive control, same reason as the bundle canary's: a narrowed pattern is worth
          # trusting only once it has been shown to still match what it forbids. One sample per
          # read form, so dropping a form from the pattern fails here instead of going blind.
          matched=$(printf '%s\n' \
            "const t = import.meta.env.VITE_API_TOKEN" \
            "const s = process.env['VITE_ADMIN_SECRET']" \
            "const { VITE_API_TOKEN } = import.meta.env" \
            | grep -cE "$pattern" || true)
          if [ "$matched" -ne 3 ]; then
            echo "::error::Positive control failed: the read pattern matched $matched/3 known-bad lines."
            echo "::error::This check cannot detect anything in this state — fix the pattern before trusting it."
            exit 1
          fi

          if grep -rnE "$pattern" src/; then
            echo "::error::The SPA source reads a LEM-issued shared secret (the lines above)."
            echo "::error::A VITE_* is inlined at build time, so it would be a constant in a public bundle — see issue #950."
            exit 1
          fi
          echo "✓ src/ reads no LEM-issued shared secret (positive control present)"
      - name: Unit tests (vitest)
        working-directory: src/cqc_lem/ui
        run: npm test
      - name: Production build
        working-directory: src/cqc_lem/ui
        run: npm run build
        env:
          # LEM-issued shared secrets must never reach the bundle (issue #950): Vite inlines every
          # import.meta.env.VITE_* it can see at build time, so anything named here that the SPA
          # reads becomes a public constant. They are set to CANARY values, not real ones — the
          # grep below is what keeps the rule true, and a canary is the only way it can see a
          # regression without a real secret being in this file.
          VITE_API_TOKEN: LEM_BUNDLE_CANARY_api_access_token
          VITE_ADMIN_SECRET: LEM_BUNDLE_CANARY_admin_secret
          # The POSITIVE CONTROL for the canary below. A negative grep only proves anything if the
          # grep could have found something, so this build feeds FIXED fake values to two VITE_*
          # names the SPA reads at module scope (utils/analytics.ts) and the next step asserts at
          # least one reached dist/. If Vite's envPrefix or its inlining behaviour ever changes, that
          # assertion fails instead of the canary silently going blind. This dist/ is a build check
          # only; the shipped bundle is built by build-and-push.yml with the real values.
          VITE_POSTHOG_KEY: phc_LEM_UI_BUILD_POSITIVE_CONTROL
          VITE_POSTHOG_HOST: https://LEM-UI-BUILD-POSITIVE-CONTROL.example
          VITE_POSTHOG_REPLAY: ${{ vars.UI_POSTHOG_REPLAY }}
          VITE_POSTHOG_REPLAY_SAMPLE: ${{ vars.UI_POSTHOG_REPLAY_SAMPLE }}

      # The standing proof for issue #950's first acceptance criterion. VITE_POSTHOG_KEY is
      # deliberately not canaried: it is a third-party write-only ingest key that is MEANT to be
      # public, not a LEM-issued credential — which is exactly why it can serve as the control.
      - name: No LEM-issued shared secret in the SPA bundle
        working-directory: src/cqc_lem/ui
        run: |
          set -u
          # A missing dist/ makes `grep -rl` exit 2, which reads as "found nothing" to an `if`.
          # Without this the whole check would report success having never run.
          test -d dist || { echo "::error::dist/ not found — the bundle check did not run."; exit 1; }

          if ! grep -rqE 'phc_LEM_UI_BUILD_POSITIVE_CONTROL|LEM-UI-BUILD-POSITIVE-CONTROL' dist/; then
            echo "::error::Positive control missing: neither VITE_* the SPA reads was inlined into dist/."
            echo "::error::The canary below cannot detect anything in this state — fix the build before trusting it."
            exit 1
          fi

          grep -rl 'LEM_BUNDLE_CANARY' dist/ && found=0 || found=$?
          if [ "$found" -eq 0 ]; then
            echo "::error::A LEM-issued shared secret was inlined into the SPA bundle (the files above)."
            echo "::error::The SPA authenticates on its httpOnly session cookie — see issue #950 and src/cqc_lem/ui/src/api/client.ts."
            exit 1
          fi
          [ "$found" -eq 1 ] || { echo "::error::grep failed (exit $found) — the canary check did not run."; exit 1; }
          echo "✓ dist/ carries no LEM-issued shared secret (positive control present)"

      # The real proof for issue #1300's code-splitting criterion. It has to live here rather than
      # in vitest: `npm test` runs BEFORE `npm run build` above, so no test can ever observe dist/.
      # Before the split, an anonymous visitor reading the marketing page downloaded Dashboard,
      # ContentStudio, Account, Avatars and AdminFeedbackPage inside one 739,054-byte entry chunk.
      - name: Marketing entry chunk stays split
        working-directory: src/cqc_lem/ui
        run: |
          set -eu
          # 480 KiB. The measured entry after the split is ~421 KB; the headroom is for ordinary
          # growth, not for quietly re-absorbing a route. Raising this number is a decision, and
          # putting it in the diff is the point.
          CEILING=491520

          test -d dist/assets || { echo "::error::dist/assets not found — this check did not run."; exit 1; }

          entry=$(ls dist/assets/index-*.js 2>/dev/null | head -n1)
          [ -n "$entry" ] || { echo "::error::no entry chunk (dist/assets/index-*.js) — this check did not run."; exit 1; }
          size=$(wc -c < "$entry")
          echo "entry chunk: $entry = $size bytes (ceiling $CEILING)"
          if [ "$size" -gt "$CEILING" ]; then
            echo "::error::The SPA entry chunk is $size bytes, over the $CEILING ceiling."
            echo "::error::A statically imported route pulls the whole authenticated app into the marketing page — see App.tsx and issue #1300."
            exit 1
          fi

          # A ceiling alone would pass if the routes were split into chunks nothing loads, or if a
          # route vanished entirely. Name the ones that must exist as their own files.
          for route in Dashboard ContentStudio Account Avatars AdminFeedbackPage; do
            ls dist/assets/${route}-*.js >/dev/null 2>&1 || {
              echo "::error::No separate chunk for ${route} — it is back inside the entry bundle."
              exit 1
            }
          done
          echo "✓ entry chunk under the ceiling and every authenticated route is its own chunk"
