name: CI / Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

# Supersede a PR's own in-flight runs when it is pushed to again. cancel-in-progress is gated to
# pull_request ON PURPOSE: these workflows also run on merge_group, and cancelling a merge-queue run
# fails that queue entry and evicts the PR -- the #1168/#1171 failure mode. It also protects the
# push:main runs that codeql_pr_gate.py's base-ref calibration reads from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Poetry and dependencies
        uses: ./.github/actions/poetry_setup
        with:
          python-version: ${{ matrix.python-version }}
          install-args: --with test

      # -n 4 matches the width of a GitHub-hosted runner and is pinned rather than `auto` for the
      # same reason as the integration lane. `loadfile` keeps a whole file on one worker, which is
      # what the 40+ module-scoped TestClient fixtures under tests/unit/api are built for; `load`
      # would rebuild them per test and `loadscope` splits a module across its classes.
      # `-q` cancels the `-v` in pyproject's addopts (verbosity is additive) -- 11,728 result lines
      # times a [gwN] prefix is log noise, not signal. --durations=5 also comes from addopts and
      # stays, as the straggler probe: loadfile's floor is the slowest single FILE.
      - name: Run unit tests
        run: |
          poetry run pytest tests/unit \
            -n 4 --dist loadfile \
            -q --tb=short \
            -m "not slow" \
            --cov=src/cqc_lem \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
