name: Deploy CDK Stack to AWS

# Manual-only. The primary deploy path is the Hostinger VPS (build-and-push.yml
# → deploy). This AWS/CDK workflow is retained for the optional cloud path and
# no longer runs automatically on pushes to main.
on:
  workflow_dispatch:
env:
  CDK_VERSION: ${{ vars.CDK_VERSION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  API_KEY: ${{ secrets.AWS_API_KEY }}
  APPLICATION_TAG: ${{ vars.AWS_APPLICATION_NAME }}
  APPLICATION_NAME:  ${{ vars.AWS_APPLICATION_TAG }}

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Poetry and dependencies
        uses: ./.github/actions/poetry_setup
        with:
          python-version: "3.12"
          install-args: --without test

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          # The LOCKfile, as in ui-build.yml. package.json carries ranges, so keying on it means
          # the cache does not track resolved versions and a `npm ci` can restore a stale tree.
          cache-dependency-path: src/cqc_lem/ui/package-lock.json

      - name: Build React UI
        working-directory: src/cqc_lem/ui
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_ARN }}
          role-session-name: github-action-role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Bootstrap
        run: |
          . _CI/bootstrap.sh

      - name: Deploy
        run: |
          . _CI/deploy.sh