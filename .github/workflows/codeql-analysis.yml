name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "0 9 * * 1"  # Monday 09:00 UTC

env:
  # Diff-informed analysis is ON by default for Python and reports only alerts INSIDE the diff.
  # Measured in this repo: every `refs/pull/<n>/merge` python analysis returns results_count=0
  # while `refs/heads/main` returns 73 and the merge-queue ref returns 74. The PR gate compares
  # head-vs-base, so an empty head set makes `head - base` empty and the REQUIRED gate passes
  # VACUOUSLY on every pull request. It only has teeth on merge_group, which is not a pull request
  # and therefore gets the full analysis -- which is why PRs read CLEAN and are then evicted from
  # the queue with no explanation (#1168 churned 24 times, #1171 eleven).
  #
  # An alert whose DEFINITION sits outside the changed lines is invisible: PR #1171 removed the
  # last use of `_DB` at line 228 while the binding at line 11 stayed put, so nothing was reported.
  # Costs ~20% slower CodeQL on PRs. Cheap against 74 wasted merge-group matrices in one day.
  CODEQL_ACTION_DIFF_INFORMED_QUERIES: "false"

# Supersede a PR's own in-flight runs when it is pushed to again. cancel-in-progress is gated to
# pull_request ON PURPOSE: these workflows also run on merge_group, and cancelling a merge-queue run
# fails that queue entry and evicts the PR -- the #1168/#1171 failure mode. It also protects the
# push:main runs that codeql_pr_gate.py's base-ref calibration reads from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Skip Dependabot PRs — no new code to analyze
    if: github.actor != 'dependabot[bot]'

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Deliberately NOT scoped to src/cqc_lem the way the PR-gate config is:
          # this is the broad sweep, and it is the only analysis that covers scripts/ and the rest
          # of the tree — scripts/ stays in scope for exactly that reason. Three exclusions:
          #
          # `.agents/skills` is vendored code, pulled from upstream repos and pinned by content
          # hash in skills-lock.json, so we cannot fix its findings, and leaving them in blocked an
          # unrelated PR (#1145) on three py/empty-except alerts in code nobody here wrote. A
          # lockfile bump is the moment to review that code.
          #
          # `tests` is 125,708 LOC against src/'s 89,884 — more than half of every python analysis,
          # spent on code that never ships. `Analyze (python)` sets the floor for the required
          # CodeQL PR Gate, which polls until EVERY category has uploaded and so can never finish
          # sooner than the slowest one. .github/codeql/codeql-config.yml already excludes tests;
          # this keeps the two configs in agreement.
          # tests/unit/test_no_orphaned_module_globals.py stays as the local pre-flight for the one
          # finding class this gives up — py/unused-global-variable in a test file, which is what
          # evicted #1168 and #1171 from the merge queue.
          #
          # `src/cqc_lem/aws/diagram` is a generated, MINIFIED vendor bundle — app.8e9fe77f.js is
          # 2.34 MB on a single 571,880-character line, 12x the largest hand-written file in the
          # repo, plus a 3 MB source map. It is the bulk of what the javascript-typescript
          # extractor was chewing on (102s), it is referenced by nothing, and it sits in the aws/
          # tree that is an UNSUPPORTED deploy path (#973). No alert in a minified bundle is
          # actionable. Scoped to the diagram assets rather than to src/cqc_lem/aws so the CDK
          # Python there stays analysed.
          config: |
            paths-ignore:
              - .agents/skills
              - tests
              - src/cqc_lem/aws/diagram

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
