name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "0 9 * * 1"  # Monday 09:00 UTC

jobs:
  codeql:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Skip Dependabot PRs — no new code to analyze
    if: github.actor != 'dependabot[bot]'

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Deliberately NOT scoped to src/cqc_lem the way codeql.yml and the PR-gate config are:
          # this is the broad sweep, and it is the only analysis that covers scripts/ and the rest
          # of the tree. The single exclusion is vendored code — `.agents/skills` is pulled from
          # upstream repos and pinned by content hash in skills-lock.json, so we cannot fix its
          # findings, and leaving them in blocked an unrelated PR (#1145) on three py/empty-except
          # alerts in code nobody here wrote. A lockfile bump is the moment to review that code.
          config: |
            paths-ignore:
              - .agents/skills

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
