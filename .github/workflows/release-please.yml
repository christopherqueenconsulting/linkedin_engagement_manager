name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: python
          # RELEASE_DISPATCH_TOKEN (user PAT, Contents+PRs write) must author the release PR:
          # a real-user author means the PR's CI runs automatically. With the default
          # GITHUB_TOKEN the PR is bot-authored and EVERY check sits in action_required until
          # someone clicks "Approve and run" (GitHub's anti-recursion safety).
          token: ${{ secrets.RELEASE_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          # Manages the version in pyproject.toml + maintains CHANGELOG.md.
          # Merging the release PR creates a tag + GitHub Release (vX.Y.Z).

      # The GitHub Release is published above; explicitly dispatch the build so a merged
      # release auto-builds + auto-deploys. GITHUB_TOKEN on purpose (NOT the PAT): it can
      # dispatch same-repo workflows fine (proven v0.34-v0.36), while a fine-grained PAT
      # without Actions:write 403s (broke the v0.37.0 dispatch).
      - name: Trigger build & deploy for the new release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-and-push.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ steps.release.outputs.tag_name }}"
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

  # Safety net for the merge queue: it merges the release PR under a rewritten SHA,
  # so release-please can't find it ("SHA not found in recent commits, skipping") and
  # never tags/builds. This job is SHA-independent — it just ensures the version that's
  # now on main has a tag, creating it + dispatching the build if not. No-op on normal
  # merges (version unchanged → tag already exists).
  ensure-release-tag:
    name: Ensure release tag (merge-queue safe)
    runs-on: ubuntu-latest
    needs: release-please
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag + dispatch build if the current version is untagged
        env:
          # GITHUB_TOKEN here too — same-repo release create + workflow dispatch both work
          # with it, and the fine-grained PAT (no Actions:write) cannot dispatch.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/^version = "(.*)"/\1/')"
          tag="v${version}"
          if [ -z "${version}" ]; then echo "Could not read version from pyproject.toml"; exit 1; fi
          if git ls-remote --tags origin "refs/tags/${tag}" | grep -q "${tag}"; then
            echo "Tag ${tag} already exists — nothing to do."
            exit 0
          fi
          echo "Version ${version} is on main but ${tag} doesn't exist (merge queue rewrote the"
          echo "release-PR SHA, so release-please skipped tagging). Creating ${tag} + dispatching build."
          gh release create "${tag}" --target "${GITHUB_SHA}" --title "${tag}" --generate-notes
          gh workflow run build-and-push.yml --repo "${{ github.repository }}" --ref "${tag}"
