name: CI / Integration Test w/ Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

# Supersede a PR's own in-flight runs when it is pushed to again. cancel-in-progress is gated to
# pull_request ON PURPOSE: these workflows also run on merge_group, and cancelling a merge-queue run
# fails that queue entry and evicts the PR -- the #1168/#1171 failure mode. It also protects the
# push:main runs that codeql_pr_gate.py's base-ref calibration reads from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test_root
          MYSQL_DATABASE: linkedin_manager
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_password
      MYSQL_DATABASE: linkedin_manager
      MYSQL_PORT: 3306
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      OPENAI_API_KEY: test-key-not-real
      LITELLM_BASE_URL: http://localhost:4000
      LITELLM_MASTER_KEY: test-master-key
      # There is no LiteLLM proxy on this runner, and there is not meant to be. The production
      # default rides out ~24s of refused connections per call so a deploy restart cannot lose a
      # generation (issue #986), which here would be 24s of sleeping for an answer nothing wants.
      #
      # This is now a BACKSTOP, not the fix. It was worth 132s of this lane (185s -> 53s) while
      # three tests still made live calls; with those mocked and `_no_live_llm_calls` refusing any
      # new one (issue #1188), removing it measured 45.7s against 50.6s — i.e. nothing. It stays
      # for the one path the guard cannot cover: the guard is function-scoped, so a module- or
      # session-scoped fixture that reached the network during ITS setup would run outside it.
      #
      # The retry schedule itself is covered in the unit lane, which sets this var per test.
      LLM_CONNECT_RETRY_ATTEMPTS: 1

    steps:
      - uses: actions/checkout@v7

      # The MySQL service starts EMPTY, so any integration test that touches a real table used to
      # die on "Table doesn't exist". Build the same schema the stack runs: the base tables from
      # setup.sql (docker-entrypoint-initdb.d in compose) then every Flyway migration on top.
      #
      # Started in the BACKGROUND, before Poetry, because the two are completely independent —
      # 112 Flyway migrations plus a JVM start took ~22s while `poetry install` took ~24s, one after
      # the other, for no reason. GitHub has already waited on the service healthchecks by the time
      # any step runs, so MySQL is up and this can begin immediately. The exit code lands in a
      # sentinel file that the wait step below reads; `wait` itself is useless here because every
      # `run:` block is a separate shell, so the job would have no child to wait on.
      - name: Provision the database schema (background)
        run: |
          nohup bash -c 'scripts/ci_provision_test_schema.sh; echo $? > /tmp/schema.rc' \
            > /tmp/schema.log 2>&1 &

      - name: Set up Poetry and dependencies
        uses: ./.github/actions/poetry_setup
        with:
          python-version: "3.12"
          install-args: --with test

      # Fail CLOSED. An unreadable or missing sentinel is treated as a failure, never as "probably
      # fine" — the whole point of the schema step is that tests silently skip against an empty one.
      - name: Wait for the database schema
        run: |
          for _ in $(seq 1 120); do
            [ -f /tmp/schema.rc ] && break
            sleep 1
          done
          if [ ! -f /tmp/schema.rc ]; then
            echo "::error::Schema provisioning never finished (no sentinel after 120s)."
            cat /tmp/schema.log 2>/dev/null || true
            exit 1
          fi
          rc=$(cat /tmp/schema.rc)
          cat /tmp/schema.log
          [ "$rc" = "0" ] || { echo "::error::Schema provisioning failed (exit $rc)."; exit 1; }

      # -n 4 matches the width of a GitHub-hosted runner. `loadfile` keeps a file on one worker,
      # which is what the module-scoped TestClient fixtures in this lane are built for; row
      # isolation does NOT come from the distribution mode, it comes from the per-worker database in
      # tests/integration/conftest.py.
      - name: Run integration tests
        run: |
          set +e
          poetry run pytest tests/integration \
            -n 4 --dist loadfile \
            -v --tb=short \
            --cov=src/cqc_lem \
            --cov-report=xml \
            --cov-report=term-missing
          rc=$?
          set -e
          # Exit code 5 = no tests collected; treat as passing until tests are written
          [ $rc -eq 5 ] && echo "No integration tests found yet — skipping" && exit 0 || exit $rc

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: integration
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
