name: CI / Integration Test w/ Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test_root
          MYSQL_DATABASE: linkedin_manager
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_password
      MYSQL_DATABASE: linkedin_manager
      MYSQL_PORT: 3306
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      OPENAI_API_KEY: test-key-not-real
      LITELLM_BASE_URL: http://localhost:4000
      LITELLM_MASTER_KEY: test-master-key

    steps:
      - uses: actions/checkout@v7

      - name: Set up Poetry and dependencies
        uses: ./.github/actions/poetry_setup
        with:
          python-version: "3.12"
          install-args: --with test

      # The MySQL service starts EMPTY, so any integration test that touches a real table used to
      # die on "Table doesn't exist". Build the same schema the stack runs: the base tables from
      # setup.sql (docker-entrypoint-initdb.d in compose) then every Flyway migration on top.
      - name: Provision the database schema
        run: |
          set -e
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/compose/local/database:/sql:ro" mysql:8 \
            sh -c 'mysql -h 127.0.0.1 -P 3306 -uroot -ptest_root < /sql/setup.sql'
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/compose/local/database/migrations:/flyway/sql:ro" \
            redgate/flyway:latest-alpine \
            -url="jdbc:mysql://127.0.0.1:3306/linkedin_manager?allowPublicKeyRetrieval=true" \
            -schemas=linkedin_manager -user=root -password=test_root \
            -connectRetries=10 -outOfOrder=true -baselineOnMigrate=true migrate
          # A no-op migrate exits 0, which would leave the tests silently skipping on an empty
          # schema — assert the newest table is really there before running them.
          docker run --rm --network host mysql:8 \
            mysql -h 127.0.0.1 -P 3306 -uroot -ptest_root linkedin_manager \
            -e 'SELECT 1 FROM comment_outcomes LIMIT 1'

      - name: Run integration tests
        run: |
          set +e
          poetry run pytest tests/integration \
            -v --tb=short \
            --cov=src/cqc_lem \
            --cov-report=xml \
            --cov-report=term-missing
          rc=$?
          set -e
          # Exit code 5 = no tests collected; treat as passing until tests are written
          [ $rc -eq 5 ] && echo "No integration tests found yet — skipping" && exit 0 || exit $rc

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: integration
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
