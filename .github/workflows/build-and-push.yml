name: Build & Deploy Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to build & deploy (defaults to the ref)"
        required: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cqc-lem

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version tag
        id: ver
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./compose/local/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.tag }}
            ${{ env.IMAGE }}:latest
          build-args: |
            INSTALL_DEV_DEPS=false
            VITE_POSTHOG_KEY=${{ secrets.UI_POSTHOG_KEY }}
            VITE_POSTHOG_HOST=${{ vars.UI_POSTHOG_HOST }}
            VITE_POSTHOG_REPLAY=${{ vars.UI_POSTHOG_REPLAY }}
            VITE_POSTHOG_REPLAY_SAMPLE=${{ vars.UI_POSTHOG_REPLAY_SAMPLE }}
            VITE_PUBLIC_BASE_URL=${{ vars.PUBLIC_BASE_URL }}
            POSTHOG_CLI_ENV_ID=${{ vars.POSTHOG_PROJECT_ID }}
            POSTHOG_CLI_HOST=${{ vars.POSTHOG_APP_HOST }}
          # Personal API key with error_tracking:write — a build secret, never an ARG, so it can't
          # be read back out of the image history. Absent = the upload step skips itself.
          secrets: |
            posthog_cli_token=${{ secrets.POSTHOG_CLI_TOKEN }}
          # Registry, not type=gha. This job only runs on `release: published`, so github.ref is
          # refs/tags/vX.Y.Z — and Actions caches are ref-scoped, meaning every blob written here
          # was scoped to a tag the NEXT release can never match. mode=max wrote ~90 of them per
          # release: unreadable forever, and competing for the same 10 GB the PR lanes' venv caches
          # live in. A registry cache costs no Actions quota and actually persists across tags.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  deploy:
    name: Deploy to Hostinger VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    # Protected environment. The required-reviewer gate was removed so green
    # releases auto-deploy; re-add reviewers in repo settings to restore it.
    environment: production
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
      POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
      POSTHOG_APP_HOST: ${{ vars.POSTHOG_APP_HOST }}
    steps:
      # SSH to the VPS can intermittently time out ("dial tcp :22 i/o timeout") — the block is
      # upstream of the box (Hostinger network / anti-abuse); on-box sshd + ufw are fine. Ride it
      # out with up to 5 attempts, a longer 120s connect timeout, and exponential backoff spanning
      # ~6.5 min. The default 10m command_timeout once KILLED `docker compose up` mid-recreation, so
      # command_timeout stays large (deploy.sh health-checks + rolls back within it, so it must not
      # be cut off). deploy.sh is idempotent, so retries are safe. Each attempt runs only if the
      # immediately preceding attempt FAILED (a success leaves later attempts 'skipped', not run).
      - name: Deploy over SSH (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 25m
          envs: GHCR_USER,GHCR_PAT
          script: |
            set -e
            cd /opt/lem
            ./scripts/deploy.sh "${{ needs.build-and-push.outputs.tag }}"
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}

      - name: Backoff before deploy retry 2
        if: ${{ steps.deploy1.outcome == 'failure' }}
        run: sleep 30

      - name: Deploy over SSH (attempt 2)
        id: deploy2
        if: ${{ steps.deploy1.outcome == 'failure' }}
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 25m
          envs: GHCR_USER,GHCR_PAT
          script: |
            set -e
            cd /opt/lem
            ./scripts/deploy.sh "${{ needs.build-and-push.outputs.tag }}"
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}

      - name: Backoff before deploy retry 3
        if: ${{ steps.deploy2.outcome == 'failure' }}
        run: sleep 60

      - name: Deploy over SSH (attempt 3)
        id: deploy3
        if: ${{ steps.deploy2.outcome == 'failure' }}
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 25m
          envs: GHCR_USER,GHCR_PAT
          script: |
            set -e
            cd /opt/lem
            ./scripts/deploy.sh "${{ needs.build-and-push.outputs.tag }}"
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}

      - name: Backoff before deploy retry 4
        if: ${{ steps.deploy3.outcome == 'failure' }}
        run: sleep 120

      - name: Deploy over SSH (attempt 4)
        id: deploy4
        if: ${{ steps.deploy3.outcome == 'failure' }}
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 25m
          envs: GHCR_USER,GHCR_PAT
          script: |
            set -e
            cd /opt/lem
            ./scripts/deploy.sh "${{ needs.build-and-push.outputs.tag }}"
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}

      - name: Backoff before deploy retry 5
        if: ${{ steps.deploy4.outcome == 'failure' }}
        run: sleep 180

      - name: Deploy over SSH (attempt 5, final)
        id: deploy5
        if: ${{ steps.deploy4.outcome == 'failure' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 25m
          envs: GHCR_USER,GHCR_PAT
          script: |
            set -e
            cd /opt/lem
            ./scripts/deploy.sh "${{ needs.build-and-push.outputs.tag }}"
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}

      # Purge the CDN so users get the new index.html shell immediately instead
      # of a cached one pointing at the previous (hashed) bundle. Skips cleanly
      # if the Cloudflare secrets aren't configured.
      - name: Purge Cloudflare cache
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ZONE_ID != '' }}
        run: |
          resp=$(curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$resp"
          echo "$resp" | grep -q '"success":true' \
            && echo "Cloudflare cache purged" \
            || { echo "Cloudflare purge failed"; exit 1; }

      # Marks every PostHog insight graph with "vX.Y.Z deployed" at the tagged version this job
      # just shipped — issue #654. continue-on-error because deploy.sh's own health check already
      # passed by this point; a PostHog hiccup here must not fail an otherwise-successful release.
      # The script itself degrades gracefully (exits 0) when POSTHOG_PERSONAL_API_KEY isn't set.
      - name: Checkout (for the annotation script)
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build-and-push.outputs.tag }}

      - name: Post release annotation to PostHog
        continue-on-error: true
        run: |
          pip install --quiet requests
          python scripts/posthog_annotate.py --tag "${{ needs.build-and-push.outputs.tag }}"
