name: Build & Deploy Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to build & deploy (defaults to the ref)"
        required: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cqc-lem

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version tag
        id: ver
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./compose/local/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.tag }}
            ${{ env.IMAGE }}:latest
          build-args: |
            INSTALL_DEV_DEPS=false
            VITE_POSTHOG_KEY=${{ secrets.UI_POSTHOG_KEY }}
            VITE_POSTHOG_HOST=${{ vars.UI_POSTHOG_HOST }}
            VITE_POSTHOG_REPLAY=${{ vars.UI_POSTHOG_REPLAY }}
            VITE_POSTHOG_REPLAY_SAMPLE=${{ vars.UI_POSTHOG_REPLAY_SAMPLE }}
            VITE_PUBLIC_BASE_URL=${{ vars.PUBLIC_BASE_URL }}
            POSTHOG_CLI_ENV_ID=${{ vars.POSTHOG_PROJECT_ID }}
            POSTHOG_CLI_HOST=${{ vars.POSTHOG_APP_HOST }}
          # Personal API key with error_tracking:write — a build secret, never an ARG, so it can't
          # be read back out of the image history. Absent = the upload step skips itself.
          secrets: |
            posthog_cli_token=${{ secrets.POSTHOG_CLI_TOKEN }}
          # Registry, not type=gha. This job only runs on `release: published`, so github.ref is
          # refs/tags/vX.Y.Z — and Actions caches are ref-scoped, meaning every blob written here
          # was scoped to a tag the NEXT release can never match. mode=max wrote ~90 of them per
          # release: unreadable forever, and competing for the same 10 GB the PR lanes' venv caches
          # live in. A registry cache costs no Actions quota and actually persists across tags.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  # #1133: the ONE human gate this graph has, placed at the expensive-mistake point rather than
  # per-PR review. `deploy`'s required-reviewer gate is gone (see its own comment below) so green
  # releases auto-deploy — right for the overwhelming majority, wrong for a release carrying a
  # one-way Flyway migration or a risk:security/risk:live-linkedin/risk:product-decision PR. This
  # job never fails the WORKFLOW (a flag is correct, expected behavior, not an error) — it only
  # writes `flagged`, which `deploy`'s own `if:` reads. Logic lives in scripts/release_risk_check.py
  # (tested; stdlib + `gh` CLI only) so it can be unit-tested instead of debugged as inline YAML.
  # Full design + the 3 gauntlet-loop rounds that shaped it: docs/graphs/deploy-release.md.
  release-risk-check:
    name: Release risk check
    # Deliberately NOT `needs: build-and-push` — this job only reads the GitHub API, so running it
    # alongside the ~10 min image build is what keeps an UNFLAGGED release at exactly today's
    # latency (an acceptance criterion of #1133). It resolves the tag the same way
    # `build-and-push`'s `ver` step does rather than waiting on that job's output.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: write
    outputs:
      flagged: ${{ steps.check.outputs.flagged }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Flag a migration-bearing or risk:*-labelled release
        id: check
        # The tag rides in through the environment, never interpolated into the shell line: a git
        # ref may legally contain `"`, `$`, `;` and backticks, so `--tag "${{ ... }}"` would be a
        # script-injection seam on a value this job does not control.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
        run: |
          python3 scripts/release_risk_check.py --tag "$RELEASE_TAG"

  deploy:
    name: Deploy to Hostinger VPS
    needs: [build-and-push, release-risk-check]
    runs-on: ubuntu-latest
    # Protected environment. The required-reviewer gate was removed so green
    # releases auto-deploy; re-add reviewers in repo settings to restore it.
    #
    # `release-risk-check` above is the narrower gate that replaces it for the risky subset only
    # (#1133): a migration or a risk:*-labelled PR in this release skips this job entirely and
    # parks the release on a Decision Comment for the owner's manual
    # `gh workflow run deploy-vps.yml -f tag=vX.Y.Z`. Everything else deploys exactly as before,
    # with no added latency — the check runs CONCURRENTLY with the image build, so it has long
    # finished by the time this job would have started.
    #
    # No `always()` here on purpose: if the check job itself dies (runner/checkout failure — the
    # script's own reads all fail open and it always exits 0), `deploy` is skipped rather than
    # deploying past an unread gate. The workflow run goes red, and the manual entrypoint above is
    # the same one a flagged release uses.
    if: needs.release-risk-check.outputs.flagged != 'true'
    environment: production
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
      POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
      POSTHOG_APP_HOST: ${{ vars.POSTHOG_APP_HOST }}
    steps:
      # SSH to the VPS can intermittently time out ("dial tcp :22 i/o timeout") — the block is
      # upstream of the box (Hostinger network / anti-abuse); on-box sshd + ufw are fine. Ride it
      # out with up to 5 attempts, a longer 120s connect timeout, and exponential backoff spanning
      # ~6.5 min. The default 10m command_timeout once KILLED `docker compose up` mid-recreation, so
      # command_timeout stays large (deploy.sh health-checks + rolls back within it, so it must not
      # be cut off). deploy.sh is idempotent, so retries are safe. Each attempt runs only if the
      # immediately preceding attempt FAILED (a success leaves later attempts 'skipped', not run).
      - name: Deploy over SSH (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 25m
          envs: GHCR_USER,GHCR_PAT
          script: |
            set -e
            cd /opt/lem
            ./scripts/deploy.sh "${{ needs.build-and-push.outputs.tag }}"
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}

      - name: Backoff before deploy retry 2
        if: ${{ steps.deploy1.outcome == 'failure' }}
        run: sleep 30

      - name: Deploy over SSH (attempt 2)
        id: deploy2
        if: ${{ steps.deploy1.outcome == 'failure' }}
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 25m
          envs: GHCR_USER,GHCR_PAT
          script: |
            set -e
            cd /opt/lem
            ./scripts/deploy.sh "${{ needs.build-and-push.outputs.tag }}"
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}

      - name: Backoff before deploy retry 3
        if: ${{ steps.deploy2.outcome == 'failure' }}
        run: sleep 60

      - name: Deploy over SSH (attempt 3)
        id: deploy3
        if: ${{ steps.deploy2.outcome == 'failure' }}
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 25m
          envs: GHCR_USER,GHCR_PAT
          script: |
            set -e
            cd /opt/lem
            ./scripts/deploy.sh "${{ needs.build-and-push.outputs.tag }}"
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}

      - name: Backoff before deploy retry 4
        if: ${{ steps.deploy3.outcome == 'failure' }}
        run: sleep 120

      - name: Deploy over SSH (attempt 4)
        id: deploy4
        if: ${{ steps.deploy3.outcome == 'failure' }}
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 25m
          envs: GHCR_USER,GHCR_PAT
          script: |
            set -e
            cd /opt/lem
            ./scripts/deploy.sh "${{ needs.build-and-push.outputs.tag }}"
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}

      - name: Backoff before deploy retry 5
        if: ${{ steps.deploy4.outcome == 'failure' }}
        run: sleep 180

      - name: Deploy over SSH (attempt 5, final)
        id: deploy5
        if: ${{ steps.deploy4.outcome == 'failure' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 25m
          envs: GHCR_USER,GHCR_PAT
          script: |
            set -e
            cd /opt/lem
            ./scripts/deploy.sh "${{ needs.build-and-push.outputs.tag }}"
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}

      # Purge the CDN so users get the new index.html shell immediately instead
      # of a cached one pointing at the previous (hashed) bundle. Skips cleanly
      # if the Cloudflare secrets aren't configured.
      - name: Purge Cloudflare cache
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ZONE_ID != '' }}
        run: |
          resp=$(curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$resp"
          echo "$resp" | grep -q '"success":true' \
            && echo "Cloudflare cache purged" \
            || { echo "Cloudflare purge failed"; exit 1; }

      # Marks every PostHog insight graph with "vX.Y.Z deployed" at the tagged version this job
      # just shipped — issue #654. continue-on-error because deploy.sh's own health check already
      # passed by this point; a PostHog hiccup here must not fail an otherwise-successful release.
      # The script itself degrades gracefully (exits 0) when POSTHOG_PERSONAL_API_KEY isn't set.
      - name: Checkout (for the annotation script)
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build-and-push.outputs.tag }}

      - name: Post release annotation to PostHog
        continue-on-error: true
        run: |
          pip install --quiet requests
          python scripts/posthog_annotate.py --tag "${{ needs.build-and-push.outputs.tag }}"
